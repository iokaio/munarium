# example-openai — a GPT-family provider config for a front end that lets
# users choose a model family.
#
# A front end maps its "GPT" family choice to
# `model_override: { provider: example-openai, tier: fast|capable|frontier }`
# on each session turn; the built-in tier table resolves fast -> gpt-5.4-mini,
# capable -> gpt-5.4 and frontier -> gpt-5.6-sol. A runbook lists this config
# in `models.allowOverrides`. The credential is the same env var the
# synthesized default uses — this config exists so the override policy can
# name a family explicitly, not to change credentials.
#
# The rpm budget is a guard: a public-facing front end should never be able
# to saturate a shared key. The dailyTokens ceilings are the spending caps:
# per-tier daily token budgets, UTC-day window, enforced in op_complete
# against the shared ledger (migration 0029). A tier without a value is
# unlimited.
#
#   mmctl apply -f runbooks/providers/example-openai.yaml
apiVersion: munarium.ioka.io/v1
kind: ProviderConfig
metadata: { name: example-openai }
spec:
  provider: openai
  credentialRef: { env: MUNARIUM_SECRET_OPENAI }
  budgets:
    rpm: 30
    dailyTokens: { fast: 1000000, capable: 500000, frontier: 250000 }  # placeholders: size to your own keys
