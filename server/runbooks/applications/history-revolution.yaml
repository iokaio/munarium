# history-revolution — a large public archival corpus as one retrieval
# application.
#
# What this demonstrates: sharding a large corpus into many collections
# balanced by BYTES rather than by document count, with stable hash-based
# assignment. Index-build cost tracks chunks, and bytes predict chunks far
# better than document counts do — a collection of long documents and one of
# short documents can differ by an order of magnitude in bytes per document.
#
# Server mapping (version 2): five semantic groups survive as path
# *directories* (founders / narrative / printed / maps / newspapers), and
# within them the corpus is sharded into 58 collections balanced by BYTES at
# ~10 MB each. Sharding is hash-based on the file's basename
# (sha256(basename) % shards), so it is stable across re-runs. Document bytes
# are untouched — this is a blob-path concern only.
#
# The collections list below was GENERATED from a shard table (group, shard
# count, sha256(basename) % shards). Whatever uploader you write must agree
# with these bindings exactly, or documents land in blob and bind to nothing.
#
# All collections are level 0 — this is public-domain archival material and
# there is no clearance story to invent. `mmctl runbook validate` will
# emit the INFO finding `collections.uniform-access` for exactly that
# reason; it is correct and expected here.
#
#   mmctl apply -f runbooks/shapes/archival-documents.yaml
#   mmctl apply -f runbooks/applications/history-revolution.yaml
#   mmctl run history-revolution --watch
apiVersion: munarium.ioka.io/v1
kind: Runbook
metadata: { name: history-revolution, version: 2 }
spec:
  # Where this runbook's documents live. The blob path IS the ingest
  # filename, so every collection binding below sits under this prefix —
  # `mmctl runbook validate` errors if one does not.
  sources:
    container: sources
    prefix: "rev/"
  # Why this runbook cannot use the default:
  # only `cutover` can pause a run, so under `stepMajor` the FIRST request
  # has to build EVERY collection before reaching a gate. At 530 MB that
  # request cannot finish — the local rehearsal died at the client timeout
  # and wedged its step. `collectionMajor` walks one collection through all
  # five steps before starting the next, so each request builds exactly one
  # collection and the approval gates chunk the load.
  execution: { order: collectionMajor }
  collections:
    # founders/gw <- gw (4 shard(s))
    - name: loc-founders-gw-b0
      shape: archival-documents@1
      accessLevel: 0
      sources: { filenamePrefix: "rev/founders/gw/b0/" }
