  # The largest corpus of the sample set by two orders of magnitude: a wide
  # candidate pool before fusion is what keeps a single 1777 broadside
  # reachable beside 16,849 newspaper pages.
  retrieval:
    topK: 20
    rrfK: 60
    candidateN: 400
    # A chunk must hold at least two of the query's words to enter the lexical
    # pool (a GIN-indexable filter evaluated before any rank). The OR leg
    # otherwise ranks every chunk containing ANY query word — most of a
    # newspaper shard for "washington" — and those single-word rows sort last
    # under density ranking regardless.
    minimumShouldMatch: 2
    # A query word found in more than 30% of a shard's chunks is a stop word
    # IN THAT SHARD: it still counts toward the rank but no longer makes every
    # chunk holding it a candidate ("washington" in the letterbook shards,
    # "boston" in the newspapers). Learned from each shard's own frequencies
    # at build time — no vocabulary is configured.
    stopTermFraction: 0.3
    # Wide-corpus selection and lexical expansion are generic algorithms, not
    # a catalog of anticipated names or questions. The original query probes
    # every permitted shard; the engine ranks shards by the evidence in each
    # probe pool — the query's own adjacent word pairs found verbatim, then
    # term density, then vector distance — and the strongest twelve get a deep
    # candidate pool; the other forty-six keep their probe pools in the merge
    # (selection spends the deep search, it never excludes — excluding them
    # loses the 1773 pages reporting the tea's destruction, because the
    # papers never say "tea party" and the narratives do). Twelve of fifty-eight leaves room for a four-shard
    # corpus plus the collections that quote it (on term density alone the
    # travel narratives out-scored every letterbook shard for an entity
    # question, because they USE the words; phrase evidence put all four
    # letterbook shards in the top five). The fast model contributes only
    # safety-constrained single-word lexical variants.
    collectionSelection:
      maxCollections: 12
      probeCandidateN: 50
      candidatePoolPerCollection: 100
      # density × (1 + phraseBoost × phrase-fraction). A phrase-first order
      # lets 0.06 of "tea party" (a later coinage) in the
      # narratives outrank the newspaper shards holding the December 1773
      # reports; at 3 the letterbooks still lead the entity question 3.5×
      # and density decides the newspaper one.
      phraseBoost: 3.0
    modelQueryExpansion:
      maxTerms: 16
      maxTokens: 256   # doubled 2026-09-02 with every per-call budget (was 128)
      required: false
    # Ranking weight of the generated variants. Below ~0.7 a record's header
    # (the entity name repeated in a title line) out-ranks the body passage
    # that answers with five matched variants but names the entity once.
    queryExpansionWeight: 0.8
    # Weighted global fusion: without it the two legs disagree completely
    # and the merge interleaved them rank for rank. The built-in bag-of-words
    # embedder's global rank-1s were fragments ("0 1424 215/3") and town-name
    # tables — the shortest chunk sharing any token — so the vector leg is
    # down-weighted until a real embedder is indexed; and the letterbook
    # shards the probe ranked first got 4 of 20 hits while a travel narrative
    # (denser in the expansion words) took 6. The collection-evidence leg
    # carries the probe's ranking into the merge as a prior.
    fusion:
      lexicalWeight: 1.0
      vectorWeight: 0.3
      collectionEvidenceWeight: 1.0
      # The forty-six unselected shards' probe pools merge as their own
      # stratum (original-query scores are not comparable with the expanded
      # search's — merged raw, they push every letterbook hit out of the
      # top 20). At 1.0 a probe rank-1 counts like
      # a deep rank-1 and the evidence leg arbitrates.
      unselectedPoolWeight: 1.0
    # LOC collection listings are retained for discovery and provenance, but
    # a listing with no transcribed text must not outrank a served full record.
    contentDemotions:
      - contains: "**Text:** none (metadata record)"
        lexicalMultiplier: 0.001
        vectorDistancePenalty: 2.0
        # Tested against the chunk's tsvector as the phrase text→none→
        # metadata→record instead of lowering and scanning every candidate
        # row's text: the substring test is the costliest per-row term of
        # the lexical leg under load.
        match: phrase
        # The maps collection is a catalog: its records ("Fort on Dorchester
        # Point", "Fort on Charlestown Point") carry the marker because the
        # map itself has no text, and they ARE the answer to a "which maps"
        # question. With the rule applied there, loc-maps never enters a
        # turn's selection or top 20.
        exceptCollections: [loc-maps]
  models:
    default: { provider: default, tier: capable }
    tasks:
      completion: { provider: default, tier: capable }
      validation: { tier: fast }
      query_expansion: { provider: default, tier: fast }
    allowOverrides: [default, example-anthropic, example-openai, example-openrouter]
  completion:
    promptTemplate: |
      You are a documentary-history researcher working over Library of
      Congress American Revolution sources.

      Rules:
      - You know this period from training. That knowledge is OFF LIMITS. A
        historically true statement the served text does not support is a
        fabrication here.
      - Cite only documents whose text is in the context below. A search hit
        you did not actually read is not a citation.
      - Label every document you discuss, quote, or characterize with its
        bracketed [collection/chunk] tag from the context — including in an
        answer that explains what the documents do NOT contain. A partial
        answer earns its citations the same way a full one does. (An answer
        that discusses no specific document cites nothing.)
      - Quote the source's own words, spelling and dating as written; note
        Old Style dates rather than silently converting them.
      - OCR text is noisy. Say when a passage is uncertain instead of
        smoothing it into confident prose.
      - If the served documents do not answer the question AS ASKED, open
        with that in plain words — "The served documents do not …" — before
        describing any related content they do hold. A reader must never
        have to infer the negative from the shape of the positives.

      {context}

      Question: {query}
    # topK 20 over 1,500-char chunks is ~30k characters; the engine default
    # (16,000) would serve the model only the first ten hits. Sized so every
    # merged hit reaches the prompt — the cost is input tokens per turn.
    contextCharBudget: 40000
    # Completion-token ceiling. The engine default (1,024; the truncation
    # retry pays one 4x re-ask) was sized before reasoning-always-on models
    # sat behind a tier: such a model can burn several thousand hidden
    # reasoning tokens on a hard question and return EMPTY text even after
    # the retry. 2048 base -> 8,192 on the retry leaves visible-answer
    # headroom past that reasoning burn. 2026-09-02
    # doubled every per-call budget (the engine default is now 2,048), so
    # this carries 4096 -> 16,384 on the retry. A ceiling, not spend —
    # non-reasoning tiers are unaffected.
    maxTokens: 4096
  steps:
    - resolveSources: {}
    - buildIndex: {}
    - verify: {}
    - cutover: { approval: required }
    - retireOld: { keep_versions: 2 }
