{{- if .Values.gateway.enabled }}
# Plane 2: Envoy Gateway (Gateway API) on 443 — REST and gRPC share the port;
# routing is by content-type/protocol per HTTP/2. Self-signed demo cert is
# provisioned out-of-band (or cert-manager, the stretch path).
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: munarium-eg
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: munarium-gateway
spec:
  gatewayClassName: munarium-eg
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes: { namespaces: { from: Same } }
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: munarium-rest
spec:
  parentRefs: [{ name: munarium-gateway }]
  rules:
    - backendRefs: [{ name: munarium-server, port: 8080 }]
---
apiVersion: gateway.networking.k8s.io/v1
kind: GRPCRoute
metadata:
  name: munarium-grpc
spec:
  parentRefs: [{ name: munarium-gateway }]
  rules:
    - backendRefs: [{ name: munarium-server, port: 50051 }]
{{- end }}
