# SPDX-License-Identifier: Apache-2.0
# Isolated local evaluation. Run from this directory; the server is opt-in.
name: munarium-ollama

services:
  ollama:
    image: ollama/ollama:0.33.3@sha256:32931b46719f673c05fdbaa81ccb26da18ea4a1c57590a754874ab28ba269eb2
    restart: unless-stopped
    cpus: 4
    mem_limit: 6g
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_CONTEXT_LENGTH: "4096"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_KEEP_ALIVE: 5m
    ports:
      - "127.0.0.1:${OLLAMA_PORT:-11434}:11434"
    volumes:
      - models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  postgres:
    image: pgvector/pgvector:pg16@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
    restart: unless-stopped
    environment:
      POSTGRES_USER: munarium
      POSTGRES_PASSWORD: ollama-local-evaluation
      POSTGRES_DB: munarium
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U munarium -d munarium"]
      interval: 3s
      timeout: 3s
      retries: 20

  server:
    profiles: [server]
    image: munarium-ollama:development
    build:
      context: ../..
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
    environment:
      MUNARIUM_STORE: postgres
      MUNARIUM_DATABASE_URL: postgres://munarium:ollama-local-evaluation@postgres:5432/munarium
      MUNARIUM_SOURCE_STORE: pg
      MUNARIUM_RETRIEVAL_MODE: postgres
      MUNARIUM_AUTH_MODE: static
      MUNARIUM_STATIC_TOKENS: ollama-evaluation-token:ollama-evaluation:rw,ollama-other-token:ollama-other:rw
    ports:
      - "127.0.0.1:${MUNARIUM_OLLAMA_HTTP_PORT:-28080}:8080"
      - "127.0.0.1:${MUNARIUM_OLLAMA_GRPC_PORT:-25051}:50051"

volumes:
  models:
  pgdata:
