# SPDX-License-Identifier: Apache-2.0
[workspace]
resolver = "2"
members = [
    "src/munarium-proto",
    "src/munarium-api-types",
    "src/munarium-api-conv",
    "src/munarium-access",
    "src/munarium-core",
    "src/munarium-store-mem",
    "src/munarium-store-pg",
    "src/munarium-azure-auth",
    "src/munarium-store-objects",
    "src/munarium-extract",
    "src/munarium-docintel-az",
    "src/munarium-retrieval-pg",
    "src/munarium-retrieval",
    "src/munarium-datastore",
    "src/munarium-shapes",
    "src/munarium-runbooks",
    "src/munarium-authoring",
    "src/munarium-providers",
    "src/munarium-server",
    "src/munarium-cli",
    "conformance",
]

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/iokaio/munarium"

[workspace.dependencies]
# async + web
tokio = { version = "1", features = ["rt-multi-thread", "signal", "macros", "sync", "time"] }
# Already in the lockfile via tonic; a direct dep only for TcpListenerStream
# (the gRPC bind-before-spawn fix, dev-guide §13 entry 4).
tokio-stream = { version = "0.1", default-features = false, features = ["net", "sync"] }
# Already in the lockfile via axum/tonic; direct deps only for the gRPC
# trailer-status capture body wrapper (2026-08-18).
http-body = "1"
bytes = "1"
axum = "0.8"
tower = { version = "0.5", features = ["timeout", "limit", "load-shed"] }
tower-http = { version = "0.6", features = ["trace", "limit"] }
# grpc (rustls only — zero openssl anywhere in the workspace)
tonic = { version = "0.12", features = ["tls", "tls-roots"] }
tonic-health = "0.12"
tonic-reflection = "0.12"
tonic-types = "0.12"
prost = "0.13"
prost-types = "0.13"
tonic-build = "0.12"
protoc-bin-vendored = "3"
# db (added at M1; declared here so versions stay pinned workspace-wide)
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "json", "chrono", "migrate", "macros"] }
# serialization + schema
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
jsonschema = { version = "0.26", default-features = false }
pgvector = { version = "0.4", features = ["sqlx"] }
utoipa = { version = "5", features = ["axum_extras", "uuid", "chrono"] }
# capability tokens (M7; rustls-compatible — pulls ring, never openssl)
jsonwebtoken = { version = "9", default-features = false }
# ingest payload encoding (M11)
base64 = "0.22"
# errors, ids, hashing, time
thiserror = "2"
anyhow = "1"
uuid = { version = "1", features = ["v4", "v7", "serde"] }
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
regex = "1"
async-trait = "0.1"
# http client (rustls only)
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
# unified source-bytes backends (S3 / Azure Blob / GCS / local fs). The -base
# cloud features + `ring` keep aws-lc-rs (and its cmake requirement) out of the
# alpine musl builder; `reqwest` here is object_store's own 0.13 line,
# default-features off (rustls) — no openssl enters the graph.
object_store = { version = "0.14", default-features = false, features = ["fs", "aws-base", "azure-base", "gcp-base", "reqwest", "ring"] }
# telemetry
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[profile.release]
lto = "thin"
strip = "symbols"
codegen-units = 1
