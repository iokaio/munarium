// MMP v1 — Command API. The model proposes; the mesh disposes: every write path
// runs the deterministic gates below the application layer. All command RPCs
// require an `idempotency-key` metadata entry; replays return the recorded
// outcome. Optimistic concurrency via expected_head — a mismatch is a normal,
// retryable ABORTED, never data loss.
syntax = "proto3";

package mmp.v1;

import "mmp/v1/common.proto";
import "mmp/v1/ledger.proto";

message CreateVersionRequest {
  string parent_version_id = 1; // empty = new lineage root
  string metadata_json = 2;     // e.g. {"as_of": "2026-08-08"}
}
message CreateVersionResponse {
  string version_id = 1;
}

message ProposeClaimRequest {
  string version_id = 1;
  optional uint64 expected_head = 2; // optimistic head check; absent = don't check
  ClaimType claim_type = 3;
  string subject = 4;
  string key = 5;
  string value = 6;
  string scope_path = 7;
  Provenance provenance = 8;
  string supersedes_id = 9; // corrections/updates name the superseded claim
  string entity_id = 10;
  string evidence_json = 11;
  double confidence = 12;
  string shape_ref = 13;
  ClaimOrigin origin = 14;    // connector provenance, optional
}
message ProposeClaimResponse {
  Claim claim = 1;                    // recorded ACCEPTED or DISPUTED — never dropped
  repeated GateFinding findings = 2;  // gate outcomes for this proposal
  uint64 head_seq = 3;
}

message AppendEventsRequest {
  string version_id = 1;
  optional uint64 expected_head = 2;
  repeated ProposeClaimRequest claims = 3; // batched; gated as one candidate unit
  string candidate_text = 4;               // optional full output text for text gates
}
message AppendEventsResponse {
  repeated Claim claims = 1;
  repeated GateFinding findings = 2;
  uint64 head_seq = 3;
}

message OpenPromiseRequest {
  string version_id = 1;
  string key = 2;
  string kind = 3;
  string description = 4;
  string origin_scope = 5;
  string due_scope = 6;
}
message OpenPromiseResponse {
  Promise promise = 1;
}

message FulfillPromiseRequest {
  string version_id = 1;
  string key = 2;
  string result_ref = 3;
}
message FulfillPromiseResponse {
  bool fulfilled = 1; // false = no open promise with that key
}

message LockAnchorRequest {
  string version_id = 1;
  string subject = 2;
  string key = 3;
  string value = 4;
  string scope_path = 5;
  string evidence_json = 6;
}
message LockAnchorResponse {
  Anchor anchor = 1;
}

message RecordCountsRequest {
  string version_id = 1;
  string key = 2;
  string scope_path = 3;
  uint64 count = 4;
  uint64 budget = 5; // 0 = no budget
}
message RecordCountsResponse {}

message UpsertDigestRequest {
  Digest digest = 1;
}
message UpsertDigestResponse {}

service CommandService {
  rpc CreateVersion(CreateVersionRequest) returns (CreateVersionResponse);
  rpc ProposeClaim(ProposeClaimRequest) returns (ProposeClaimResponse);
  rpc AppendEvents(AppendEventsRequest) returns (AppendEventsResponse);
  rpc OpenPromise(OpenPromiseRequest) returns (OpenPromiseResponse);
  rpc FulfillPromise(FulfillPromiseRequest) returns (FulfillPromiseResponse);
  rpc LockAnchor(LockAnchorRequest) returns (LockAnchorResponse);
  rpc RecordCounts(RecordCountsRequest) returns (RecordCountsResponse);
  rpc UpsertDigest(UpsertDigestRequest) returns (UpsertDigestResponse);
}
