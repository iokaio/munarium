[package]
name = "munarium-providers"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Provider gateway: Anthropic, OpenAI, OpenRouter, and local Ollama chat and embeddings. Optional Ollama proxy credentials and cloud keys resolve at call time."

[dependencies]
munarium-core = { path = "../munarium-core" }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
reqwest = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
axum = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
