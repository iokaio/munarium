[package]
name = "munarium-store-mem"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "In-memory StorageBackend: the conformance target, dev profile option, and the reference the Postgres backend is property-tested against."

[dependencies]
munarium-core = { path = "../munarium-core" }
async-trait = { workspace = true }
chrono = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["sync"] }
uuid = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros"] }
