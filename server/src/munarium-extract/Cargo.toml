# SPDX-License-Identifier: Apache-2.0
[package]
name = "munarium-extract"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Text extraction for indexable documents: DOCX and PDF today, OCR for scans behind a feature. Pure Rust only — the image is a static musl binary on distroless, so a native dependency is not a tradeoff, it is a build failure."

[dependencies]
munarium-core = { path = "../munarium-core" }
tracing = { workspace = true }

# DOCX = a ZIP holding word/document.xml.
#
# `default-features = false` matters: zip's defaults pull bzip2, lzma, zstd,
# xz, ppmd and AES, some of which bind C libraries and would break the static
# musl link. DOCX only ever uses deflate, so only `deflate-flate2` is selected:
# the inflate path, without zopfli (a compressor this read-only use never
# runs). `deflate-flate2-zlib` and `deflate-flate2-zlib-ng` are the C backends
# and must never be selected here.
#
# >=9.0.5 is required, not preferred: earlier versions carry RUSTSEC-2026-0367,
# -0368, -0369, -0429, -0545 and -0548 (extraction, AES authentication and
# stream-name advisories). Only `ZipArchive::by_name` is used here, but a
# vulnerable zip in the graph fails cargo-deny all the same.
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2"] }
# Declared only to pin zip's inflate backend. zip 9 has no feature that selects
# flate2's pure-Rust miniz_oxide backend, and flate2 with no backend does not
# compile. This is the crate and backend zip 2's `deflate` feature selected,
# already in the graph (lopdf uses it too), so DOCX inflation keeps the same
# implementation and no new crate arrives.
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
# >=0.41 is required, not preferred: earlier versions carry an unbounded
# allocation advisory on namespace declarations, and a DOCX is untrusted
# caller-supplied XML — precisely the input that advisory describes.
quick-xml = "0.41"

# PDF text layer. Pure Rust (wraps lopdf); no pdfium/poppler.
# >=0.12 pulls lopdf >=0.42, which fixes RUSTSEC-2026-0187: unbounded
# recursion on nested PDF objects aborted the PROCESS (SIGABRT) on a crafted
# upload. Anyone who can ingest a PDF could have killed the server.
pdf-extract = "0.12"

# --- OCR (feature `ocr`) -----------------------------------------------------
# ocrs is pure-Rust OCR (text detection + recognition) on the rten runtime.
# It is the ONLY credible option here: every Tesseract route (leptess,
# tesseract-rs) binds libtesseract/libleptonica as C++ natives, and
# rusty-tesseract shells out to a binary — none can exist in a
# rust:alpine -> distroless/static build.
#
# `image` decodes the bitmaps OCR consumes: multi-page TIFF, PNG, JPEG.
# default-features = false keeps the C-backed codecs out of the graph.
ocrs = { version = "0.12", optional = true }
# Pinned to the version ocrs itself depends on: declaring a newer rten pulls
# a SECOND copy of the whole ML runtime into the binary, which this image
# budget cannot absorb. `rten_format` loads the .rten model files.
rten = { version = "0.24", optional = true, default-features = false, features = ["rten_format"] }
image = { version = "0.25", optional = true, default-features = false, features = ["png", "jpeg", "tiff"] }
# Used DIRECTLY for multi-page TIFF: image 0.25's TiffDecoder exposes only the
# first frame, and a scanned multi-page fax is the whole point here. Already in
# the graph via `image`, so this adds nothing new.
tiff = { version = "0.11", optional = true }
lopdf = { version = "0.42", optional = true, default-features = false }

[features]
default = []
# OCR for scanned PDFs and TIFFs. Off by default: it adds ~10 MB of model
# runtime to the image and is CPU-expensive, so it is an explicit choice.
ocr = ["dep:ocrs", "dep:rten", "dep:image", "dep:tiff", "dep:lopdf"]

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros"] }

# The isolated PDF child's Linux limits (R3/B4): `setrlimit` through a safe
# wrapper, so this crate declares no FFI of its own. rlimit 0.11.0 (MIT,
# Nugine/rlimit, released 2026-02-01) depends only on libc, which std already
# links and which is in the graph; it works on musl. Exact pin: a change of
# enforcement mechanism must be a reviewed change.
[target.'cfg(all(target_os = "linux", target_pointer_width = "64"))'.dependencies]
rlimit = "=0.11.0"
# The same child marks itself non-dumpable (`prctl(PR_SET_DUMPABLE, 0)`)
# through rustix's safe wrapper: `RLIMIT_CORE` does not stop a core_pattern
# pipe handler, which would otherwise receive the child's whole address space.
# rustix 1.1.6 (Apache-2.0 WITH LLVM-exception OR Apache-2.0 OR MIT,
# bytecodealliance/rustix) is already in the Linux graph through `tempfile`;
# this adds only its `process` feature. Exact pin for the same reason; 1.1.6
# is the release that fixes RUSTSEC-2026-0486 (xattr functions, unused here).
rustix = { version = "=1.1.6", default-features = false, features = ["std", "process"] }
