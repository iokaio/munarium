# SPDX-License-Identifier: Apache-2.0
[package]
name = "munarium-proto"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
# What goes into the .crate. `proto/**` is the copy of ../../proto that a
# release makes right before `cargo package` (see README.md); it does not exist
# in the workspace, and build.rs falls back to ../../proto when it is absent.
include = ["src/**", "build.rs", "proto/**", "LICENSE", "NOTICE", "README.md"]
description = "Generated MMP (Munarium Protocol) types and gRPC service stubs. Wire-only: nothing else in the workspace may leak these types past a service boundary."

[dependencies]
prost = { workspace = true }
prost-types = { workspace = true }
tonic = { workspace = true }

[build-dependencies]
tonic-build = { workspace = true }
protoc-bin-vendored = { workspace = true }
