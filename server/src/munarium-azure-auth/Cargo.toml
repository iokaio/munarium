[package]
name = "munarium-azure-auth"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Managed-identity token acquisition for Azure resource planes (Container Apps/App Service endpoint or IMDS), with expiry-skew caching."

[dependencies]
munarium-core = { path = "../munarium-core" }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros"] }
