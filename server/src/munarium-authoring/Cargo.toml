[package]
name = "munarium-authoring"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Guided runbook-set authoring: the served pattern catalog, the retrieval-ordered interview, deterministic shape+runbook materialization, set-level cross-document validation, and the hash-manifested export bundle. Pure like munarium-runbooks — no I/O, no async; the server layer owns persistence and provider calls."

[dependencies]
munarium-shapes = { path = "../munarium-shapes" }
munarium-runbooks = { path = "../munarium-runbooks" }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
