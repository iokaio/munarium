[package]
name = "munarium-docintel-az"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Azure AI Document Intelligence behind munarium-core's DocumentIntelligence trait: the OCR escalation for scans that local extraction cannot read. Hand-rolled over the Analyze Document REST surface on the workspace's rustls reqwest — no Azure SDK."

[dependencies]
munarium-core = { path = "../munarium-core" }
munarium-azure-auth = { path = "../munarium-azure-auth" }
async-trait = { workspace = true }
base64 = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros"] }
