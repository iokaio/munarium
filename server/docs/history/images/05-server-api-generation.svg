<svg xmlns='http://www.w3.org/2000/svg' width='1500' height='760' viewBox='0 0 1500 760' font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"><defs><marker id='a2b6cb0' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='8' markerHeight='8' orient='auto-start-reverse'><path d='M0 0 L10 5 L0 10 z' fill='#2b6cb0'/></marker><marker id='s2b6cb0' viewBox='0 0 10 10' refX='1' refY='5' markerWidth='8' markerHeight='8' orient='auto-start-reverse'><path d='M0 0 L10 5 L0 10 z' fill='#2b6cb0'/></marker><marker id='a52606d' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='8' markerHeight='8' orient='auto-start-reverse'><path d='M0 0 L10 5 L0 10 z' fill='#52606d'/></marker><marker id='s52606d' viewBox='0 0 10 10' refX='1' refY='5' markerWidth='8' markerHeight='8' orient='auto-start-reverse'><path d='M0 0 L10 5 L0 10 z' fill='#52606d'/></marker><marker id='a9aa5b1' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='8' markerHeight='8' orient='auto-start-reverse'><path d='M0 0 L10 5 L0 10 z' fill='#9aa5b1'/></marker><marker id='s9aa5b1' viewBox='0 0 10 10' refX='1' refY='5' markerWidth='8' markerHeight='8' orient='auto-start-reverse'><path d='M0 0 L10 5 L0 10 z' fill='#9aa5b1'/></marker></defs><rect width='100%' height='100%' fill='#ffffff'/><text x='32' y='44' font-size='24' font-weight='700' fill='#1f2933' text-anchor='start'>One operation inventory, two transports, four SDKs (PR #25, extended in #28)</text><text x='32' y='72' font-size='14' font-weight='400' fill='#52606d' text-anchor='start'>gRPC is generated from the REST OpenAPI document and dispatches into the same in-process handlers.</text><rect x='40' y='130' width='330' height='110' rx='10' fill='#e8f0fe' stroke='#2b6cb0' stroke-width='1.6'/><text x='205.0' y='165.2' font-size='14' font-weight='700' fill='#1f2933' text-anchor='middle'>server/docs/api/openapi.json</text><text x='205.0' y='187.14' font-size='12' font-weight='400' fill='#52606d' text-anchor='middle'>emitted by the Server binary</text><text x='205.0' y='203.7' font-size='12' font-weight='400' fill='#52606d' text-anchor='middle'>117 operations at 1.2.0,</text><text x='205.0' y='220.26' font-size='12' font-weight='400' fill='#52606d' text-anchor='middle'>121 at 1.2.1</text><rect x='440' y='145' width='300' height='80' rx='10' fill='#f0ebfb' stroke='#6b46c1' stroke-width='1.6'/><text x='590.0' y='181.76' font-size='14' font-weight='700' fill='#1f2933' text-anchor='middle'>scripts/generate_server_api.py</text><text x='590.0' y='203.7' font-size='12' font-weight='400' fill='#52606d' text-anchor='middle'>--check reports stale outputs</text><path d='M 370 185 L 440 185' fill='none' stroke='#52606d' stroke-width='1.8' marker-end='url(#a52606d)'/><rect x='830' y='100' width='360' height='54' rx='10' fill='#e8f0fe' stroke='#2b6cb0' stroke-width='1.6'/><text x='1010.0' y='124.09' font-size='13' font-weight='700' fill='#1f2933' text-anchor='middle'>server_api.proto</text><text x='1010.0' y='144.65' font-size='11' font-weight='400' fill='#52606d' text-anchor='middle'>mmp.v1.ServerApiService</text><path d='M 740 185 L 790 185 L 790 127 L 830 127' fill='none' stroke='#9aa5b1' stroke-width='1.3' marker-end='url(#a9aa5b1)'/><rect x='830' y='164' width='360' height='54' rx='10' fill='#e8f0fe' stroke='#2b6cb0' stroke-width='1.6'/><text x='1010.0' y='188.09' font-size='13' font-weight='700' fill='#1f2933' text-anchor='middle'>grpc_api_generated.rs</text><text x='1010.0' y='208.65' font-size='11' font-weight='400' fill='#52606d' text-anchor='middle'>each RPC → fixed local handler</text><path d='M 740 185 L 790 185 L 790 191 L 830 191' fill='none' stroke='#9aa5b1' stroke-width='1.3' marker-end='url(#a9aa5b1)'/><rect x='830' y='228' width='360' height='54' rx='10' fill='#fdf3e1' stroke='#b7791f' stroke-width='1.6'/><text x='1010.0' y='252.09' font-size='13' font-weight='700' fill='#1f2933' text-anchor='middle'>clients/server-api.json</text><text x='1010.0' y='272.65' font-size='11' font-weight='400' fill='#52606d' text-anchor='middle'>operation inventory + version</text><path d='M 740 185 L 790 185 L 790 255 L 830 255' fill='none' stroke='#9aa5b1' stroke-width='1.3' marker-end='url(#a9aa5b1)'/><rect x='830' y='292' width='360' height='54' rx='10' fill='#fdf3e1' stroke='#b7791f' stroke-width='1.6'/><text x='1010.0' y='316.09' font-size='13' font-weight='700' fill='#1f2933' text-anchor='middle'>Rust server_api_generated.rs</text><text x='1010.0' y='336.65' font-size='11' font-weight='400' fill='#52606d' text-anchor='middle'>ServerApiClient</text><path d='M 740 185 L 790 185 L 790 319 L 830 319' fill='none' stroke='#9aa5b1' stroke-width='1.3' marker-end='url(#a9aa5b1)'/><rect x='830' y='356' width='360' height='54' rx='10' fill='#fdf3e1' stroke='#b7791f' stroke-width='1.6'/><text x='1010.0' y='380.09' font-size='13' font-weight='700' fill='#1f2933' text-anchor='middle'>Python server_api.py</text><text x='1010.0' y='400.65' font-size='11' font-weight='400' fill='#52606d' text-anchor='middle'>sync and async clients</text><path d='M 740 185 L 790 185 L 790 383 L 830 383' fill='none' stroke='#9aa5b1' stroke-width='1.3' marker-end='url(#a9aa5b1)'/><rect x='830' y='420' width='360' height='54' rx='10' fill='#fdf3e1' stroke='#b7791f' stroke-width='1.6'/><text x='1010.0' y='444.09' font-size='13' font-weight='700' fill='#1f2933' text-anchor='middle'>.NET ServerApiClient.Generated.cs</text><text x='1010.0' y='464.65' font-size='11' font-weight='400' fill='#52606d' text-anchor='middle'>ServerApiClient</text><path d='M 740 185 L 790 185 L 790 447 L 830 447' fill='none' stroke='#9aa5b1' stroke-width='1.3' marker-end='url(#a9aa5b1)'/><rect x='830' y='484' width='360' height='54' rx='10' fill='#fdf3e1' stroke='#b7791f' stroke-width='1.6'/><text x='1010.0' y='508.09' font-size='13' font-weight='700' fill='#1f2933' text-anchor='middle'>Java ServerApiClient.java</text><text x='1010.0' y='528.65' font-size='11' font-weight='400' fill='#52606d' text-anchor='middle'>sync and CompletableFuture</text><path d='M 740 185 L 790 185 L 790 511 L 830 511' fill='none' stroke='#9aa5b1' stroke-width='1.3' marker-end='url(#a9aa5b1)'/><text x='1210' y='120.0' font-size='13' font-weight='700' fill='#1f2933' text-anchor='start'>Server side</text><text x='1210' y='250.0' font-size='13' font-weight='400' fill='#52606d' text-anchor='start'>SDK side</text><text x='1210' y='268.85' font-size='13' font-weight='400' fill='#52606d' text-anchor='start'>(package version</text><text x='1210' y='287.7' font-size='13' font-weight='400' fill='#52606d' text-anchor='start'> 1.1.0 at #25)</text><rect x='40' y='570' width='1420' height='160' rx='14' fill='#fafbfc' stroke='#7b8794' stroke-width='1.6'/><text x='60' y='602' font-size='16' font-weight='700' fill='#1f2933' text-anchor='start'>At runtime</text><rect x='60' y='620' width='260' height='60' rx='10' fill='#e8f0fe' stroke='#2b6cb0' stroke-width='1.6'/><text x='190.0' y='646.76' font-size='14' font-weight='700' fill='#1f2933' text-anchor='middle'>REST request</text><text x='190.0' y='668.7' font-size='12' font-weight='400' fill='#52606d' text-anchor='middle'>documented REST operation</text><rect x='60' y='688' width='260' height='34' rx='10' fill='#e8f0fe' stroke='#2b6cb0' stroke-width='1.6'/><text x='190.0' y='710.0400000000001' font-size='14' font-weight='700' fill='#1f2933' text-anchor='middle'>native gRPC RPC</text><rect x='460' y='630' width='440' height='80' rx='10' fill='#e6f4ea' stroke='#2f855a' stroke-width='1.6'/><text x='680.0' y='666.76' font-size='14' font-weight='700' fill='#1f2933' text-anchor='middle'>Same in-process handler</text><text x='680.0' y='688.7' font-size='12' font-weight='400' fill='#52606d' text-anchor='middle'>authorization, limits, audit capture</text><path d='M 320 650 L 460 660' fill='none' stroke='#2b6cb0' stroke-width='1.8' marker-end='url(#a2b6cb0)'/><path d='M 320 705 L 460 690' fill='none' stroke='#2b6cb0' stroke-width='1.8' marker-end='url(#a2b6cb0)'/><text x='940' y='640.0' font-size='13' font-weight='400' fill='#52606d' text-anchor='start'>Payload bytes keep JSON null vs omitted and 64-bit integers.</text><text x='940' y='658.85' font-size='13' font-weight='400' fill='#52606d' text-anchor='start'>Session streaming stays streaming over both transports.</text><text x='940' y='677.7' font-size='13' font-weight='400' fill='#52606d' text-anchor='start'>Existing typed client planes stay compatible.</text><text x='940' y='696.55' font-size='13' font-weight='400' fill='#52606d' text-anchor='start'>Not an HTTP proxy; HTML and Prometheus are not APIs.</text><text x='40' y='300.0' font-size='14' font-weight='400' fill='#52606d' text-anchor='start'>Why: before #25, native gRPC and</text><text x='40' y='320.3' font-size='14' font-weight='400' fill='#52606d' text-anchor='start'>the typed SDK planes covered only</text><text x='40' y='340.6' font-size='14' font-weight='400' fill='#52606d' text-anchor='start'>part of the documented REST</text><text x='40' y='360.9' font-size='14' font-weight='400' fill='#52606d' text-anchor='start'>surface. Generating every transport</text><text x='40' y='381.2' font-size='14' font-weight='400' fill='#52606d' text-anchor='start'>and SDK from one inventory makes</text><text x='40' y='401.5' font-size='14' font-weight='400' fill='#52606d' text-anchor='start'>coverage complete and drift</text><text x='40' y='421.8' font-size='14' font-weight='400' fill='#52606d' text-anchor='start'>detectable.</text></svg>