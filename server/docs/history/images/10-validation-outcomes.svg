<svg xmlns='http://www.w3.org/2000/svg' width='1500' height='660' viewBox='0 0 1500 660' font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"><defs><marker id='a2f855a' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='8' markerHeight='8' orient='auto-start-reverse'><path d='M0 0 L10 5 L0 10 z' fill='#2f855a'/></marker><marker id='s2f855a' viewBox='0 0 10 10' refX='1' refY='5' markerWidth='8' markerHeight='8' orient='auto-start-reverse'><path d='M0 0 L10 5 L0 10 z' fill='#2f855a'/></marker><marker id='a52606d' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='8' markerHeight='8' orient='auto-start-reverse'><path d='M0 0 L10 5 L0 10 z' fill='#52606d'/></marker><marker id='s52606d' viewBox='0 0 10 10' refX='1' refY='5' markerWidth='8' markerHeight='8' orient='auto-start-reverse'><path d='M0 0 L10 5 L0 10 z' fill='#52606d'/></marker><marker id='a6b46c1' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='8' markerHeight='8' orient='auto-start-reverse'><path d='M0 0 L10 5 L0 10 z' fill='#6b46c1'/></marker><marker id='s6b46c1' viewBox='0 0 10 10' refX='1' refY='5' markerWidth='8' markerHeight='8' orient='auto-start-reverse'><path d='M0 0 L10 5 L0 10 z' fill='#6b46c1'/></marker><marker id='ac05621' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='8' markerHeight='8' orient='auto-start-reverse'><path d='M0 0 L10 5 L0 10 z' fill='#c05621'/></marker><marker id='sc05621' viewBox='0 0 10 10' refX='1' refY='5' markerWidth='8' markerHeight='8' orient='auto-start-reverse'><path d='M0 0 L10 5 L0 10 z' fill='#c05621'/></marker><marker id='ac53030' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='8' markerHeight='8' orient='auto-start-reverse'><path d='M0 0 L10 5 L0 10 z' fill='#c53030'/></marker><marker id='sc53030' viewBox='0 0 10 10' refX='1' refY='5' markerWidth='8' markerHeight='8' orient='auto-start-reverse'><path d='M0 0 L10 5 L0 10 z' fill='#c53030'/></marker></defs><rect width='100%' height='100%' fill='#ffffff'/><text x='32' y='44' font-size='24' font-weight='700' fill='#1f2933' text-anchor='start'>Truthful local validation: outcomes, exit codes and receipts (PR #46, roadmap P02)</text><text x='32' y='72' font-size='14' font-weight='400' fill='#52606d' text-anchor='start'>server/gates.ps1 and server/test.ps1 now declare steps through tools/validation.ps1 and validation-tiers.ps1.</text><text x='40' y='120' font-size='16' font-weight='700' fill='#1f2933' text-anchor='start'>Each selected step records one outcome</text><rect x='40' y='140' width='420' height='62' rx='10' fill='#e6f4ea' stroke='#2f855a' stroke-width='1.6'/><text x='250.0' y='167.76' font-size='14' font-weight='700' fill='#1f2933' text-anchor='middle'>passed</text><text x='250.0' y='189.7' font-size='12' font-weight='400' fill='#52606d' text-anchor='middle'>ran and succeeded</text><rect x='40' y='216' width='420' height='62' rx='10' fill='#fdecec' stroke='#c53030' stroke-width='1.6'/><text x='250.0' y='243.76' font-size='14' font-weight='700' fill='#1f2933' text-anchor='middle'>failed</text><text x='250.0' y='265.7' font-size='12' font-weight='400' fill='#52606d' text-anchor='middle'>check, configured prerequisite, runner or cleanup failed</text><rect x='40' y='292' width='420' height='62' rx='10' fill='#fff4e0' stroke='#c05621' stroke-width='1.6'/><text x='250.0' y='319.76' font-size='14' font-weight='700' fill='#1f2933' text-anchor='middle'>not_run + reason</text><text x='250.0' y='341.7' font-size='12' font-weight='400' fill='#52606d' text-anchor='middle'>e.g. missing executable; dependency_not_passed</text><rect x='40' y='368' width='420' height='62' rx='10' fill='#f4f5f7' stroke='#7b8794' stroke-width='1.6'/><text x='250.0' y='395.76' font-size='14' font-weight='700' fill='#1f2933' text-anchor='middle'>not_requested</text><text x='250.0' y='417.7' font-size='12' font-weight='400' fill='#52606d' text-anchor='middle'>tier not selected for this profile</text><text x='540' y='120' font-size='16' font-weight='700' fill='#1f2933' text-anchor='start'>Exit code: failures take precedence</text><polygon points='700,150.0 850.0,200 700,250.0 550.0,200' fill='#f4f5f7' stroke='#7b8794' stroke-width='1.6'/><text x='700' y='204.55' font-size='13' font-weight='700' fill='#1f2933' text-anchor='middle'>Any step failed?</text><rect x='900' y='170' width='150' height='60' rx='10' fill='#fdecec' stroke='#c53030' stroke-width='1.6'/><text x='975.0' y='205.4' font-size='15' font-weight='700' fill='#1f2933' text-anchor='middle'>exit 1</text><path d='M 850 200 L 900 200' fill='none' stroke='#c53030' stroke-width='1.8' marker-end='url(#ac53030)'/><rect x='858.92' y='178' width='32.160000000000004' height='20' rx='4' fill='#ffffff' opacity='0.92'/><text x='875' y='191' font-size='12' font-weight='600' fill='#c53030' text-anchor='middle'>yes</text><polygon points='700,295.0 850.0,350 700,405.0 550.0,350' fill='#f4f5f7' stroke='#7b8794' stroke-width='1.6'/><text x='700' y='346.1' font-size='13' font-weight='700' fill='#1f2933' text-anchor='middle'>Required coverage</text><text x='700' y='363.0' font-size='13' font-weight='400' fill='#1f2933' text-anchor='middle'>missing, or source changed?</text><path d='M 700 250 L 700 295' fill='none' stroke='#52606d' stroke-width='1.8' marker-end='url(#a52606d)'/><rect x='713.28' y='264' width='25.44' height='20' rx='4' fill='#ffffff' opacity='0.92'/><text x='726' y='277' font-size='12' font-weight='600' fill='#52606d' text-anchor='middle'>no</text><rect x='900' y='320' width='150' height='60' rx='10' fill='#fff4e0' stroke='#c05621' stroke-width='1.6'/><text x='975.0' y='355.4' font-size='15' font-weight='700' fill='#1f2933' text-anchor='middle'>exit 3</text><path d='M 850 350 L 900 350' fill='none' stroke='#c05621' stroke-width='1.8' marker-end='url(#ac05621)'/><rect x='858.92' y='328' width='32.160000000000004' height='20' rx='4' fill='#ffffff' opacity='0.92'/><text x='875' y='341' font-size='12' font-weight='600' fill='#c05621' text-anchor='middle'>yes</text><rect x='625' y='450' width='150' height='60' rx='10' fill='#e6f4ea' stroke='#2f855a' stroke-width='1.6'/><text x='700.0' y='485.4' font-size='15' font-weight='700' fill='#1f2933' text-anchor='middle'>exit 0</text><path d='M 700 405 L 700 450' fill='none' stroke='#2f855a' stroke-width='1.8' marker-end='url(#a2f855a)'/><rect x='713.28' y='420' width='25.44' height='20' rx='4' fill='#ffffff' opacity='0.92'/><text x='726' y='433' font-size='12' font-weight='600' fill='#52606d' text-anchor='middle'>no</text><text x='1110' y='120' font-size='16' font-weight='700' fill='#1f2933' text-anchor='start'>Receipt lifecycle</text><rect x='1110' y='140' width='350' height='62' rx='10' fill='#f0ebfb' stroke='#6b46c1' stroke-width='1.6'/><text x='1285.0' y='167.76' font-size='14' font-weight='700' fill='#1f2933' text-anchor='middle'>Create incomplete receipt</text><text x='1285.0' y='189.7' font-size='12' font-weight='400' fill='#52606d' text-anchor='middle'>unique path; never overwrite another run</text><path d='M 1285 202 L 1285 220' fill='none' stroke='#6b46c1' stroke-width='1.4' marker-end='url(#a6b46c1)'/><rect x='1110' y='220' width='350' height='62' rx='10' fill='#f0ebfb' stroke='#6b46c1' stroke-width='1.6'/><text x='1285.0' y='247.76' font-size='14' font-weight='700' fill='#1f2933' text-anchor='middle'>Update atomically per step</text><text x='1285.0' y='269.7' font-size='12' font-weight='400' fill='#52606d' text-anchor='middle'>commands, timings, tool hashes</text><path d='M 1285 282 L 1285 300' fill='none' stroke='#6b46c1' stroke-width='1.4' marker-end='url(#a6b46c1)'/><rect x='1110' y='300' width='350' height='62' rx='10' fill='#f0ebfb' stroke='#6b46c1' stroke-width='1.6'/><text x='1285.0' y='327.76' font-size='14' font-weight='700' fill='#1f2933' text-anchor='middle'>Clean up owned resources</text><text x='1285.0' y='349.7' font-size='12' font-weight='400' fill='#52606d' text-anchor='middle'>only what this run created</text><path d='M 1285 362 L 1285 380' fill='none' stroke='#6b46c1' stroke-width='1.4' marker-end='url(#a6b46c1)'/><rect x='1110' y='380' width='350' height='62' rx='10' fill='#f0ebfb' stroke='#6b46c1' stroke-width='1.6'/><text x='1285.0' y='407.76' font-size='14' font-weight='700' fill='#1f2933' text-anchor='middle'>Hash inputs again</text><text x='1285.0' y='429.7' font-size='12' font-weight='400' fill='#52606d' text-anchor='middle'>pre/post SHA-256 input manifests</text><path d='M 1285 442 L 1285 460' fill='none' stroke='#6b46c1' stroke-width='1.4' marker-end='url(#a6b46c1)'/><rect x='1110' y='460' width='350' height='62' rx='10' fill='#f0ebfb' stroke='#6b46c1' stroke-width='1.6'/><text x='1285.0' y='487.76' font-size='14' font-weight='700' fill='#1f2933' text-anchor='middle'>Write completion marker</text><text x='1285.0' y='509.7' font-size='12' font-weight='400' fill='#52606d' text-anchor='middle'>complete does not mean passed</text><text x='40' y='560.0' font-size='14' font-weight='400' fill='#52606d' text-anchor='start'>Why: a green process exit did not show what ran. A missing prerequisite, an early return or a native failure swallowed by PowerShell could look like a pass.</text><text x='40' y='580.3' font-size='14' font-weight='400' fill='#52606d' text-anchor='start'>Consumers verify a receipt against an expected run id (tools/check_validation_receipt.py) instead of trusting the newest file in a folder.</text><text x='40' y='600.6' font-size='14' font-weight='400' fill='#52606d' text-anchor='start'>Same PR (P03): tools/test-json-features.ps1 checks default vs arbitrary-precision serde_json through DTOs, PostgreSQL reopen, authoring and sealed artifacts</text><text x='40' y='620.9' font-size='14' font-weight='400' fill='#52606d' text-anchor='start'>in both directions, and fixes marker-key misreads, YAML number markers and PowerShell null environment removal. Stored formats are unchanged.</text></svg>