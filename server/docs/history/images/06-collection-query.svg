<svg xmlns='http://www.w3.org/2000/svg' width='1500' height='965' viewBox='0 0 1500 965' font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"><defs><marker id='a52606d' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='8' markerHeight='8' orient='auto-start-reverse'><path d='M0 0 L10 5 L0 10 z' fill='#52606d'/></marker><marker id='s52606d' viewBox='0 0 10 10' refX='1' refY='5' markerWidth='8' markerHeight='8' orient='auto-start-reverse'><path d='M0 0 L10 5 L0 10 z' fill='#52606d'/></marker><marker id='a6b46c1' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='8' markerHeight='8' orient='auto-start-reverse'><path d='M0 0 L10 5 L0 10 z' fill='#6b46c1'/></marker><marker id='s6b46c1' viewBox='0 0 10 10' refX='1' refY='5' markerWidth='8' markerHeight='8' orient='auto-start-reverse'><path d='M0 0 L10 5 L0 10 z' fill='#6b46c1'/></marker><marker id='ab7791f' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='8' markerHeight='8' orient='auto-start-reverse'><path d='M0 0 L10 5 L0 10 z' fill='#b7791f'/></marker><marker id='sb7791f' viewBox='0 0 10 10' refX='1' refY='5' markerWidth='8' markerHeight='8' orient='auto-start-reverse'><path d='M0 0 L10 5 L0 10 z' fill='#b7791f'/></marker></defs><rect width='100%' height='100%' fill='#ffffff'/><text x='32' y='44' font-size='24' font-weight='700' fill='#1f2933' text-anchor='start'>Server-owned collection answers: POST /v1.2/query (PR #28, Server 1.2.1)</text><text x='32' y='72' font-size='14' font-weight='400' fill='#52606d' text-anchor='start'>The application passes the question through unchanged; Server makes every retrieval, governance and model decision.</text><rect x='40' y='110' width='330' height='110' rx='10' fill='#fdf3e1' stroke='#b7791f' stroke-width='1.6'/><text x='205.0' y='153.48' font-size='14' font-weight='700' fill='#1f2933' text-anchor='middle'>Application</text><text x='205.0' y='175.42' font-size='12' font-weight='400' fill='#52606d' text-anchor='middle'>question (unchanged), collection</text><text x='205.0' y='191.98' font-size='12' font-weight='400' fill='#52606d' text-anchor='middle'>scope, optional governing date</text><rect x='440' y='110' width='400' height='66' rx='10' fill='#e8f0fe' stroke='#2b6cb0' stroke-width='1.6'/><text x='640.0' y='148.04' font-size='14' font-weight='700' fill='#1f2933' text-anchor='middle'>1. Authenticate; enforce token clearance</text><text x='870' y='138.0' font-size='13' font-weight='400' fill='#52606d' text-anchor='start'>expired capability, other user/tenant → refused</text><path d='M 640.0 176 L 640.0 192' fill='none' stroke='#52606d' stroke-width='1.5' marker-end='url(#a52606d)'/><rect x='440' y='192' width='400' height='66' rx='10' fill='#e8f0fe' stroke='#2b6cb0' stroke-width='1.6'/><text x='640.0' y='230.04' font-size='14' font-weight='700' fill='#1f2933' text-anchor='middle'>2. Constrain to collection scope</text><text x='870' y='220.0' font-size='13' font-weight='400' fill='#52606d' text-anchor='start'>access levels and compartments</text><path d='M 640.0 258 L 640.0 274' fill='none' stroke='#52606d' stroke-width='1.5' marker-end='url(#a52606d)'/><rect x='440' y='274' width='400' height='66' rx='10' fill='#fff4e0' stroke='#c05621' stroke-width='1.6'/><text x='640.0' y='312.03999999999996' font-size='14' font-weight='700' fill='#1f2933' text-anchor='middle'>3. Resolve publication governance</text><text x='870' y='293.0' font-size='13' font-weight='400' fill='#52606d' text-anchor='start'>immutable publication ids, withdrawal tombstones, activated index</text><text x='870' y='311.85' font-size='13' font-weight='400' fill='#52606d' text-anchor='start'>pins, effective dates; ambiguous governing version → fail closed</text><path d='M 640.0 340 L 640.0 356' fill='none' stroke='#52606d' stroke-width='1.5' marker-end='url(#a52606d)'/><rect x='440' y='356' width='400' height='66' rx='10' fill='#e8f0fe' stroke='#2b6cb0' stroke-width='1.6'/><text x='640.0' y='394.03999999999996' font-size='14' font-weight='700' fill='#1f2933' text-anchor='middle'>4. Apply collection vocabulary</text><text x='870' y='384.0' font-size='13' font-weight='400' fill='#52606d' text-anchor='start'>Server-owned query expansion (vocabularies from 1.2.0)</text><path d='M 640.0 422 L 640.0 438' fill='none' stroke='#52606d' stroke-width='1.5' marker-end='url(#a52606d)'/><rect x='440' y='438' width='400' height='66' rx='10' fill='#e8f0fe' stroke='#2b6cb0' stroke-width='1.6'/><text x='640.0' y='476.03999999999996' font-size='14' font-weight='700' fill='#1f2933' text-anchor='middle'>5. Retrieve and rank passages</text><text x='870' y='457.0' font-size='13' font-weight='400' fill='#52606d' text-anchor='start'>cross-index fusion no longer compares incomparable lexical score</text><text x='870' y='475.85' font-size='13' font-weight='400' fill='#52606d' text-anchor='start'>ranges</text><path d='M 640.0 504 L 640.0 520' fill='none' stroke='#52606d' stroke-width='1.5' marker-end='url(#a52606d)'/><rect x='440' y='520' width='400' height='66' rx='10' fill='#e8f0fe' stroke='#2b6cb0' stroke-width='1.6'/><text x='640.0' y='558.0400000000001' font-size='14' font-weight='700' fill='#1f2933' text-anchor='middle'>6. Choose the model route</text><text x='870' y='548.0' font-size='13' font-weight='400' fill='#52606d' text-anchor='start'>exact access-level route and credential reference from operator config</text><path d='M 640.0 586 L 640.0 602' fill='none' stroke='#52606d' stroke-width='1.5' marker-end='url(#a52606d)'/><rect x='440' y='602' width='400' height='66' rx='10' fill='#e8f0fe' stroke='#2b6cb0' stroke-width='1.6'/><text x='640.0' y='640.0400000000001' font-size='14' font-weight='700' fill='#1f2933' text-anchor='middle'>7. Generate the narrative</text><text x='870' y='621.0' font-size='13' font-weight='400' fill='#52606d' text-anchor='start'>provider-native structured output (OpenAI, OpenRouter, Anthropic,</text><text x='870' y='639.85' font-size='13' font-weight='400' fill='#52606d' text-anchor='start'>Ollama)</text><path d='M 640.0 668 L 640.0 684' fill='none' stroke='#52606d' stroke-width='1.5' marker-end='url(#a52606d)'/><rect x='440' y='684' width='400' height='66' rx='10' fill='#fff4e0' stroke='#c05621' stroke-width='1.6'/><text x='640.0' y='722.0400000000001' font-size='14' font-weight='700' fill='#1f2933' text-anchor='middle'>8. Verify citations</text><text x='870' y='712.0' font-size='13' font-weight='400' fill='#52606d' text-anchor='start'>citation identity and exact-quote checks after generation</text><path d='M 640.0 750 L 640.0 766' fill='none' stroke='#52606d' stroke-width='1.5' marker-end='url(#a52606d)'/><rect x='440' y='766' width='400' height='66' rx='10' fill='#e8f0fe' stroke='#2b6cb0' stroke-width='1.6'/><text x='640.0' y='804.0400000000001' font-size='14' font-weight='700' fill='#1f2933' text-anchor='middle'>9. Recheck configuration</text><text x='870' y='785.0' font-size='13' font-weight='400' fill='#52606d' text-anchor='start'>governance or configuration changed mid-query → detected before</text><text x='870' y='803.85' font-size='13' font-weight='400' fill='#52606d' text-anchor='start'>returning</text><path d='M 370 165 L 440 143' fill='none' stroke='#b7791f' stroke-width='1.8' marker-end='url(#ab7791f)'/><rect x='440' y='848' width='400' height='90' rx='10' fill='#e6f4ea' stroke='#2f855a' stroke-width='1.6'/><text x='640.0' y='873.2' font-size='14' font-weight='700' fill='#1f2933' text-anchor='middle'>Answer</text><text x='640.0' y='895.1400000000001' font-size='12' font-weight='400' fill='#52606d' text-anchor='middle'>explanation + verified references;</text><text x='640.0' y='911.7' font-size='12' font-weight='400' fill='#52606d' text-anchor='middle'>may be flagged for human review</text><text x='640.0' y='928.26' font-size='12' font-weight='400' fill='#52606d' text-anchor='middle'>or say what the files lack</text><path d='M 640.0 832 L 640.0 848' fill='none' stroke='#52606d' stroke-width='1.5' marker-end='url(#a52606d)'/><rect x='40' y='520' width='330' height='96' rx='10' fill='#f0ebfb' stroke='#6b46c1' stroke-width='1.6'/><text x='205.0' y='556.48' font-size='14' font-weight='700' fill='#1f2933' text-anchor='middle'>Publication governance</text><text x='205.0' y='578.4200000000001' font-size='12' font-weight='400' fill='#52606d' text-anchor='middle'>GET / PUT, append-only revisions;</text><text x='205.0' y='594.98' font-size='12' font-weight='400' fill='#52606d' text-anchor='middle'>operator-owned</text><path d='M 370 568 L 405 568 L 405 307 L 440 307' fill='none' stroke='#6b46c1' stroke-width='1.8' stroke-dasharray='6 5' marker-end='url(#a6b46c1)'/><rect x='365.4' y='428' width='79.2' height='20' rx='4' fill='#ffffff' opacity='0.92'/><text x='405' y='441' font-size='12' font-weight='600' fill='#52606d' text-anchor='middle'>configures</text><rect x='40' y='818' width='330' height='120' rx='10' fill='#fdf3e1' stroke='#b7791f' stroke-width='1.6'/><text x='205.0' y='858.2' font-size='14' font-weight='700' fill='#1f2933' text-anchor='middle'>Original files</text><text x='205.0' y='880.1400000000001' font-size='12' font-weight='400' fill='#52606d' text-anchor='middle'>app asks Server to authorize a</text><text x='205.0' y='896.7' font-size='12' font-weight='400' fill='#52606d' text-anchor='middle'>cited reference, then serves the</text><text x='205.0' y='913.26' font-size='12' font-weight='400' fill='#52606d' text-anchor='middle'>file itself</text><path d='M 440 893 L 370 878' fill='none' stroke='#b7791f' stroke-width='1.8' marker-end='url(#ab7791f)'/><rect x='368.76' y='858' width='72.48' height='20' rx='4' fill='#ffffff' opacity='0.92'/><text x='405' y='871' font-size='12' font-weight='600' fill='#52606d' text-anchor='middle'>reference</text></svg>