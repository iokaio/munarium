<svg xmlns='http://www.w3.org/2000/svg' width='1500' height='860' viewBox='0 0 1500 860' font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"><defs><marker id='a52606d' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='8' markerHeight='8' orient='auto-start-reverse'><path d='M0 0 L10 5 L0 10 z' fill='#52606d'/></marker><marker id='s52606d' viewBox='0 0 10 10' refX='1' refY='5' markerWidth='8' markerHeight='8' orient='auto-start-reverse'><path d='M0 0 L10 5 L0 10 z' fill='#52606d'/></marker><marker id='a6b46c1' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='8' markerHeight='8' orient='auto-start-reverse'><path d='M0 0 L10 5 L0 10 z' fill='#6b46c1'/></marker><marker id='s6b46c1' viewBox='0 0 10 10' refX='1' refY='5' markerWidth='8' markerHeight='8' orient='auto-start-reverse'><path d='M0 0 L10 5 L0 10 z' fill='#6b46c1'/></marker><marker id='ab7791f' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='8' markerHeight='8' orient='auto-start-reverse'><path d='M0 0 L10 5 L0 10 z' fill='#b7791f'/></marker><marker id='sb7791f' viewBox='0 0 10 10' refX='1' refY='5' markerWidth='8' markerHeight='8' orient='auto-start-reverse'><path d='M0 0 L10 5 L0 10 z' fill='#b7791f'/></marker><marker id='ac05621' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='8' markerHeight='8' orient='auto-start-reverse'><path d='M0 0 L10 5 L0 10 z' fill='#c05621'/></marker><marker id='sc05621' viewBox='0 0 10 10' refX='1' refY='5' markerWidth='8' markerHeight='8' orient='auto-start-reverse'><path d='M0 0 L10 5 L0 10 z' fill='#c05621'/></marker></defs><rect width='100%' height='100%' fill='#ffffff'/><text x='32' y='44' font-size='24' font-weight='700' fill='#1f2933' text-anchor='start'>clientbuild.yml: the manual registry release train (PRs #31–#37)</text><text x='32' y='72' font-size='14' font-weight='400' fill='#52606d' text-anchor='start'>workflow_dispatch only. Rehearsal by default; publication requires the release environment.</text><rect x='40' y='110' width='300' height='150' rx='10' fill='#f0ebfb' stroke='#6b46c1' stroke-width='1.6'/><text x='190.0' y='156.92' font-size='14' font-weight='700' fill='#1f2933' text-anchor='middle'>Dispatch</text><text x='190.0' y='178.85999999999999' font-size='12' font-weight='400' fill='#52606d' text-anchor='middle'>family: all (default, #37) |</text><text x='190.0' y='195.42' font-size='12' font-weight='400' fill='#52606d' text-anchor='middle'>server-clients | matrix-clients |</text><text x='190.0' y='211.98' font-size='12' font-weight='400' fill='#52606d' text-anchor='middle'>server-crates</text><text x='190.0' y='228.54' font-size='12' font-weight='400' fill='#52606d' text-anchor='middle'>registry switches default off</text><rect x='390' y='110' width='330' height='150' rx='10' fill='#f0ebfb' stroke='#6b46c1' stroke-width='1.6'/><text x='555.0' y='156.92' font-size='14' font-weight='700' fill='#1f2933' text-anchor='middle'>Preflight plan</text><text x='555.0' y='178.85999999999999' font-size='12' font-weight='400' fill='#52606d' text-anchor='middle'>versions read from manifests via</text><text x='555.0' y='195.42' font-size='12' font-weight='400' fill='#52606d' text-anchor='middle'>compatibility.json; a family must</text><text x='555.0' y='211.98' font-size='12' font-weight='400' fill='#52606d' text-anchor='middle'>agree; each registry asked if the</text><text x='555.0' y='228.54' font-size='12' font-weight='400' fill='#52606d' text-anchor='middle'>version exists → skip it (#37)</text><rect x='770' y='110' width='330' height='150' rx='10' fill='#f0ebfb' stroke='#6b46c1' stroke-width='1.6'/><text x='935.0' y='165.2' font-size='14' font-weight='700' fill='#1f2933' text-anchor='middle'>Build matrix</text><text x='935.0' y='187.14' font-size='12' font-weight='400' fill='#52606d' text-anchor='middle'>one job and artifact per package;</text><text x='935.0' y='203.7' font-size='12' font-weight='400' fill='#52606d' text-anchor='middle'>check_license.py over the built</text><text x='935.0' y='220.26' font-size='12' font-weight='400' fill='#52606d' text-anchor='middle'>artifacts</text><path d='M 340 185 L 390 185' fill='none' stroke='#52606d' stroke-width='1.8' marker-end='url(#a52606d)'/><path d='M 720 185 L 770 185' fill='none' stroke='#52606d' stroke-width='1.8' marker-end='url(#a52606d)'/><polygon points='1290,125.0 1430.0,185 1290,245.0 1150.0,185' fill='#f4f5f7' stroke='#7b8794' stroke-width='1.6'/><text x='1290' y='181.10000000000002' font-size='13' font-weight='700' fill='#1f2933' text-anchor='middle'>Any registry</text><text x='1290' y='198.00000000000003' font-size='13' font-weight='400' fill='#1f2933' text-anchor='middle'>ticked?</text><path d='M 1100 185 L 1150 185' fill='none' stroke='#52606d' stroke-width='1.8' marker-end='url(#a52606d)'/><rect x='1180' y='262' width='220' height='48' rx='10' fill='#f4f5f7' stroke='#7b8794' stroke-width='1.6'/><text x='1290.0' y='283.09' font-size='13' font-weight='700' fill='#1f2933' text-anchor='middle'>Rehearsal ends</text><text x='1290.0' y='303.65' font-size='11' font-weight='400' fill='#52606d' text-anchor='middle'>nothing published</text><path d='M 1290 245 L 1290 262' fill='none' stroke='#52606d' stroke-width='1.8' marker-end='url(#a52606d)'/><rect x='1255.28' y='245' width='25.44' height='20' rx='4' fill='#ffffff' opacity='0.92'/><text x='1268' y='258' font-size='12' font-weight='600' fill='#52606d' text-anchor='middle'>no</text><rect x='390' y='330' width='710' height='64' rx='10' fill='#fff4e0' stroke='#c05621' stroke-width='1.6'/><text x='745.0' y='358.76' font-size='14' font-weight='700' fill='#1f2933' text-anchor='middle'>release environment</text><text x='745.0' y='380.7' font-size='12' font-weight='400' fill='#52606d' text-anchor='middle'>main branch only, required reviewer</text><path d='M 1430 185 L 1470 185 L 1470 318 L 745 318 L 745 330' fill='none' stroke='#c05621' stroke-width='1.8' marker-end='url(#ac05621)'/><rect x='1433.92' y='238' width='32.160000000000004' height='20' rx='4' fill='#ffffff' opacity='0.92'/><text x='1450' y='251' font-size='12' font-weight='600' fill='#c05621' text-anchor='middle'>yes</text><rect x='40' y='440' width='330' height='110' rx='10' fill='#fdf3e1' stroke='#b7791f' stroke-width='1.6'/><text x='205.0' y='483.47999999999996' font-size='14' font-weight='700' fill='#1f2933' text-anchor='middle'>NuGet</text><text x='205.0' y='505.41999999999996' font-size='12' font-weight='400' fill='#52606d' text-anchor='middle'>OIDC trusted publishing</text><text x='205.0' y='521.9799999999999' font-size='12' font-weight='400' fill='#52606d' text-anchor='middle'>(file name fixed by policy)</text><path d='M 745 394 L 745 418 L 205 418 L 205 440' fill='none' stroke='#b7791f' stroke-width='1.4' marker-end='url(#ab7791f)'/><rect x='400' y='440' width='330' height='110' rx='10' fill='#fdf3e1' stroke='#b7791f' stroke-width='1.6'/><text x='565.0' y='483.47999999999996' font-size='14' font-weight='700' fill='#1f2933' text-anchor='middle'>PyPI</text><text x='565.0' y='505.41999999999996' font-size='12' font-weight='400' fill='#52606d' text-anchor='middle'>OIDC trusted publishing</text><text x='565.0' y='521.9799999999999' font-size='12' font-weight='400' fill='#52606d' text-anchor='middle'>per-package environment</text><path d='M 745 394 L 745 418 L 565 418 L 565 440' fill='none' stroke='#b7791f' stroke-width='1.4' marker-end='url(#ab7791f)'/><rect x='760' y='440' width='330' height='110' rx='10' fill='#fdf3e1' stroke='#b7791f' stroke-width='1.6'/><text x='925.0' y='475.2' font-size='14' font-weight='700' fill='#1f2933' text-anchor='middle'>crates.io</text><text x='925.0' y='497.14' font-size='12' font-weight='400' fill='#52606d' text-anchor='middle'>OIDC → short-lived token (#35)</text><text x='925.0' y='513.6999999999999' font-size='12' font-weight='400' fill='#52606d' text-anchor='middle'>proto → api-types → client</text><text x='925.0' y='530.2599999999999' font-size='12' font-weight='400' fill='#52606d' text-anchor='middle'>proto copy + --allow-dirty (#33)</text><path d='M 745 394 L 745 418 L 925 418 L 925 440' fill='none' stroke='#b7791f' stroke-width='1.4' marker-end='url(#ab7791f)'/><rect x='1120' y='440' width='330' height='110' rx='10' fill='#fdf3e1' stroke='#b7791f' stroke-width='1.6'/><text x='1285.0' y='483.47999999999996' font-size='14' font-weight='700' fill='#1f2933' text-anchor='middle'>Maven Central</text><text x='1285.0' y='505.41999999999996' font-size='12' font-weight='400' fill='#52606d' text-anchor='middle'>Central Portal user token</text><text x='1285.0' y='521.9799999999999' font-size='12' font-weight='400' fill='#52606d' text-anchor='middle'>bundle signed in the job</text><path d='M 745 394 L 745 418 L 1285 418 L 1285 440' fill='none' stroke='#b7791f' stroke-width='1.4' marker-end='url(#ab7791f)'/><rect x='390' y='590' width='710' height='60' rx='10' fill='#f0ebfb' stroke='#6b46c1' stroke-width='1.6'/><text x='745.0' y='616.76' font-size='14' font-weight='700' fill='#1f2933' text-anchor='middle'>Tag families that published</text><text x='745.0' y='638.7' font-size='12' font-weight='400' fill='#52606d' text-anchor='middle'>e.g. clients-v1.1.1, matrix-clients-v1.1.1; existence tested by exit status (#34)</text><path d='M 205 550 L 205 570 L 745 570 L 745 590' fill='none' stroke='#6b46c1' stroke-width='1.2' marker-end='url(#a6b46c1)'/><path d='M 565 550 L 565 570 L 745 570 L 745 590' fill='none' stroke='#6b46c1' stroke-width='1.2' marker-end='url(#a6b46c1)'/><path d='M 925 550 L 925 570 L 745 570 L 745 590' fill='none' stroke='#6b46c1' stroke-width='1.2' marker-end='url(#a6b46c1)'/><path d='M 1285 550 L 1285 570 L 745 570 L 745 590' fill='none' stroke='#6b46c1' stroke-width='1.2' marker-end='url(#a6b46c1)'/><rect x='40' y='680' width='1420' height='150' rx='12' fill='#fafbfc' stroke='#7b8794' stroke-width='1.6'/><text x='60' y='710' font-size='16' font-weight='700' fill='#1f2933' text-anchor='start'>First runs, 15 September: each failure became a small PR</text><text x='60' y='738.0' font-size='14' font-weight='400' fill='#52606d' text-anchor='start'>#32  munarium-api-types pinned munarium-proto 1.1.1; cargo publish drops the path dependency, so the crate could never resolve.</text><text x='60' y='758.3' font-size='14' font-weight='400' fill='#52606d' text-anchor='start'>#33  cargo package treats the git-ignored proto copy as uncommitted; --allow-dirty for the server-crates family only.</text><text x='60' y='778.6' font-size='14' font-weight='400' fill='#52606d' text-anchor='start'>#34  gh api prints a 404 body on stdout for a missing tag, which read as ‘tag exists’; check the exit status instead.</text><text x='60' y='798.9' font-size='14' font-weight='400' fill='#52606d' text-anchor='start'>#35/#36/#37  crates moved to trusted publishing; the missing crate README forced a new version, so all seven clients went to 1.1.1.</text></svg>