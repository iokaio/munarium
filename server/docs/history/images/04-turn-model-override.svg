<svg xmlns='http://www.w3.org/2000/svg' width='1500' height='620' viewBox='0 0 1500 620' font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"><defs><marker id='a2f855a' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='8' markerHeight='8' orient='auto-start-reverse'><path d='M0 0 L10 5 L0 10 z' fill='#2f855a'/></marker><marker id='s2f855a' viewBox='0 0 10 10' refX='1' refY='5' markerWidth='8' markerHeight='8' orient='auto-start-reverse'><path d='M0 0 L10 5 L0 10 z' fill='#2f855a'/></marker><marker id='a52606d' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='8' markerHeight='8' orient='auto-start-reverse'><path d='M0 0 L10 5 L0 10 z' fill='#52606d'/></marker><marker id='s52606d' viewBox='0 0 10 10' refX='1' refY='5' markerWidth='8' markerHeight='8' orient='auto-start-reverse'><path d='M0 0 L10 5 L0 10 z' fill='#52606d'/></marker><marker id='ac53030' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='8' markerHeight='8' orient='auto-start-reverse'><path d='M0 0 L10 5 L0 10 z' fill='#c53030'/></marker><marker id='sc53030' viewBox='0 0 10 10' refX='1' refY='5' markerWidth='8' markerHeight='8' orient='auto-start-reverse'><path d='M0 0 L10 5 L0 10 z' fill='#c53030'/></marker></defs><rect width='100%' height='100%' fill='#ffffff'/><text x='32' y='44' font-size='24' font-weight='700' fill='#1f2933' text-anchor='start'>Session-turn model overrides: before and after Server 1.1.1 (PR #21)</text><text x='32' y='72' font-size='14' font-weight='400' fill='#52606d' text-anchor='start'>A caller may choose provider / model / tier for a turn when the runbook allows it.</text><rect x='30' y='100' width='700' height='480' rx='14' fill='#fffafa' stroke='#c53030' stroke-width='1.6'/><text x='50' y='134' font-size='17' font-weight='700' fill='#1f2933' text-anchor='start'>1.1.0: the override reached only the answer step</text><rect x='70' y='160' width='620' height='60' rx='10' fill='#f4f5f7' stroke='#7b8794' stroke-width='1.6'/><text x='380.0' y='186.76' font-size='14' font-weight='700' fill='#1f2933' text-anchor='middle'>Turn request</text><text x='380.0' y='208.7' font-size='12' font-weight='400' fill='#52606d' text-anchor='middle'>override = {provider, model, tier}</text><rect x='70' y='270' width='290' height='90' rx='10' fill='#fdecec' stroke='#c53030' stroke-width='1.6'/><text x='215.0' y='303.47999999999996' font-size='14' font-weight='700' fill='#1f2933' text-anchor='middle'>Query expansion</text><text x='215.0' y='325.41999999999996' font-size='12' font-weight='400' fill='#52606d' text-anchor='middle'>used the runbook default</text><text x='215.0' y='341.97999999999996' font-size='12' font-weight='400' fill='#52606d' text-anchor='middle'>(override ignored)</text><rect x='400' y='270' width='290' height='90' rx='10' fill='#f4f5f7' stroke='#7b8794' stroke-width='1.6'/><text x='545.0' y='311.76' font-size='14' font-weight='700' fill='#1f2933' text-anchor='middle'>Answer generation</text><text x='545.0' y='333.7' font-size='12' font-weight='400' fill='#52606d' text-anchor='middle'>used the override</text><path d='M 215 220 L 215 270' fill='none' stroke='#c53030' stroke-width='1.8' marker-end='url(#ac53030)'/><path d='M 545 220 L 545 270' fill='none' stroke='#52606d' stroke-width='1.8' marker-end='url(#a52606d)'/><text x='70' y='410.0' font-size='14' font-weight='400' fill='#52606d' text-anchor='start'>• Two model choices in one turn: the chosen tier did not govern</text><text x='70' y='430.3' font-size='14' font-weight='400' fill='#52606d' text-anchor='start'>  expansion cost or latency.</text><text x='70' y='450.6' font-size='14' font-weight='400' fill='#52606d' text-anchor='start'>• A disallowed selection could be found only after expansion</text><text x='70' y='470.9' font-size='14' font-weight='400' fill='#52606d' text-anchor='start'>  had already made a provider call.</text><rect x='770' y='100' width='700' height='480' rx='14' fill='#f7fcf8' stroke='#2f855a' stroke-width='1.6'/><text x='790' y='134' font-size='17' font-weight='700' fill='#1f2933' text-anchor='start'>1.1.1: validate first, then use the choice everywhere</text><rect x='810' y='160' width='620' height='60' rx='10' fill='#f4f5f7' stroke='#7b8794' stroke-width='1.6'/><text x='1120.0' y='186.76' font-size='14' font-weight='700' fill='#1f2933' text-anchor='middle'>Turn request</text><text x='1120.0' y='208.7' font-size='12' font-weight='400' fill='#52606d' text-anchor='middle'>override = {provider, model, tier} or none</text><polygon points='1200,240.0 1365.0,285 1200,330.0 1035.0,285' fill='#f4f5f7' stroke='#7b8794' stroke-width='1.6'/><text x='1200' y='281.1' font-size='13' font-weight='700' fill='#1f2933' text-anchor='middle'>Allowed by runbook?</text><text x='1200' y='298.0' font-size='13' font-weight='400' fill='#1f2933' text-anchor='middle'>checked before any call</text><path d='M 1200 220 L 1200 240' fill='none' stroke='#52606d' stroke-width='1.8' marker-end='url(#a52606d)'/><rect x='810' y='250' width='160' height='70' rx='10' fill='#fdecec' stroke='#c53030' stroke-width='1.6'/><text x='890.0' y='281.76' font-size='14' font-weight='700' fill='#1f2933' text-anchor='middle'>Reject</text><text x='890.0' y='303.7' font-size='12' font-weight='400' fill='#52606d' text-anchor='middle'>0 provider calls</text><path d='M 1035 285 L 970 285' fill='none' stroke='#c53030' stroke-width='1.8' marker-end='url(#ac53030)'/><rect x='989.28' y='264' width='25.44' height='20' rx='4' fill='#ffffff' opacity='0.92'/><text x='1002' y='277' font-size='12' font-weight='600' fill='#c53030' text-anchor='middle'>no</text><rect x='810' y='380' width='290' height='80' rx='10' fill='#e6f4ea' stroke='#2f855a' stroke-width='1.6'/><text x='955.0' y='416.76' font-size='14' font-weight='700' fill='#1f2933' text-anchor='middle'>Query expansion</text><text x='955.0' y='438.7' font-size='12' font-weight='400' fill='#52606d' text-anchor='middle'>uses the override</text><rect x='1140' y='380' width='290' height='80' rx='10' fill='#e6f4ea' stroke='#2f855a' stroke-width='1.6'/><text x='1285.0' y='416.76' font-size='14' font-weight='700' fill='#1f2933' text-anchor='middle'>Answer generation</text><text x='1285.0' y='438.7' font-size='12' font-weight='400' fill='#52606d' text-anchor='middle'>uses the override</text><path d='M 1200 330 L 1200 355 L 955 355 L 955 380' fill='none' stroke='#2f855a' stroke-width='1.8' marker-end='url(#a2f855a)'/><path d='M 1200 330 L 1200 355 L 1285 355 L 1285 380' fill='none' stroke='#2f855a' stroke-width='1.8' marker-end='url(#a2f855a)'/><rect x='1213.92' y='338' width='32.160000000000004' height='20' rx='4' fill='#ffffff' opacity='0.92'/><text x='1230' y='351' font-size='12' font-weight='600' fill='#2f855a' text-anchor='middle'>yes</text><text x='810' y='496.0' font-size='14' font-weight='400' fill='#52606d' text-anchor='start'>• No override: each task keeps its own configured default.</text><text x='810' y='516.3' font-size='14' font-weight='400' fill='#52606d' text-anchor='start'>• Retrieval-only turn with a non-empty override: rejected.</text><text x='810' y='536.6' font-size='14' font-weight='400' fill='#52606d' text-anchor='start'>• No API schema, migration or client version change.</text></svg>