<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="640" viewBox="0 0 1500 640" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
