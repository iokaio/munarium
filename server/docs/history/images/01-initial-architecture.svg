  <text x="1210.0" y="802.7" font-size="12" font-weight="400" fill="#52606d" text-anchor="middle">versions, package identities, support</text>
  <text x="70" y="814.0" font-size="13" font-weight="400" fill="#52606d" text-anchor="start">Client conformance targets each product; compatibility.json records supported product versions.</text>
