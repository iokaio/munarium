  <rect x="1230.0" y="176" width="180.00000000000003" height="20" rx="4" fill="#ffffff" opacity="0.92" />
  <text x="1320" y="189" font-size="12" font-weight="600" fill="#52606d" text-anchor="middle">adapters: read-only calls</text>
