  <text x="770" y="451" font-size="12" font-weight="600" fill="#52606d" text-anchor="middle">sealed evidence</text>
  <path d="M 810 540 L 730 540" fill="none" stroke="#2f855a" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#a2f855a)" />
  <rect x="706.88" y="518" width="126.24000000000001" height="20" rx="4" fill="#ffffff" opacity="0.92" />
  <text x="770" y="531" font-size="12" font-weight="600" fill="#52606d" text-anchor="middle">vendored contract</text>
  <rect x="50" y="710" width="1400" height="120" rx="14" fill="#fffaf0" stroke="#b7791f" stroke-width="1.6" />
  <text x="70" y="742" font-size="16" font-weight="700" fill="#1f2933" text-anchor="start">clients/  —  official Server and Matrix libraries, with product-specific contracts</text>
  <rect x="70" y="760" width="108" height="30" rx="15.0" fill="#fdf3e1" stroke="#b7791f" stroke-width="1.3" />
