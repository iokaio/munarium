  <rect width="100%" height="100%" fill="#ffffff" />
  <text x="32" y="44" font-size="24" font-weight="700" fill="#1f2933" text-anchor="start">Munarium 1.0.0 as imported (PR #1)</text>
  <text x="32" y="72" font-size="14" font-weight="400" fill="#52606d" text-anchor="start">One Apache-2.0 repository, three components; the Server is the governance authority.</text>
  <rect x="70" y="100" width="440" height="64" rx="10" fill="#ffffff" stroke="#7b8794" stroke-width="1.6" stroke-dasharray="6 5" />
  <text x="290.0" y="128.43" font-size="15" font-weight="700" fill="#1f2933" text-anchor="middle">Model providers</text>
  <text x="290.0" y="151.75" font-size="13" font-weight="400" fill="#52606d" text-anchor="middle">bring-your-own-key; called only by Server</text>
  <rect x="990" y="100" width="440" height="64" rx="10" fill="#ffffff" stroke="#7b8794" stroke-width="1.6" stroke-dasharray="6 5" />
  <text x="1210.0" y="128.43" font-size="15" font-weight="700" fill="#1f2933" text-anchor="middle">Customer data sources</text>
  <text x="1210.0" y="151.75" font-size="13" font-weight="400" fill="#52606d" text-anchor="middle">read through declared adapter capabilities</text>
  <rect x="50" y="200" width="680" height="470" rx="14" fill="#f5f8fe" stroke="#2b6cb0" stroke-width="1.6" />
  <text x="70" y="232" font-size="16" font-weight="700" fill="#1f2933" text-anchor="start">server/  —  governed-memory service (Rust, static musl, distroless)</text>
  <rect x="70" y="250" width="640" height="58" rx="10" fill="#e8f0fe" stroke="#2b6cb0" stroke-width="1.6" />
  <text x="390.0" y="275.76" font-size="14" font-weight="700" fill="#1f2933" text-anchor="middle">munarium-server</text>
  <text x="390.0" y="297.7" font-size="12" font-weight="400" fill="#52606d" text-anchor="middle">REST + gRPC (Munarium Memory Protocol), sessions, dashboard</text>
  <rect x="70" y="318" width="310" height="94" rx="10" fill="#e8f0fe" stroke="#2b6cb0" stroke-width="1.6" />
  <text x="225.0" y="345.2" font-size="14" font-weight="700" fill="#1f2933" text-anchor="middle">Ledger &amp; governance</text>
  <text x="225.0" y="367.14" font-size="12" font-weight="400" fill="#52606d" text-anchor="middle">core, access, store-pg / mem / objects</text>
  <text x="225.0" y="383.7" font-size="12" font-weight="400" fill="#52606d" text-anchor="middle">append-only facts, supersession;</text>
  <text x="225.0" y="400.26" font-size="12" font-weight="400" fill="#52606d" text-anchor="middle">blocked claim → disputed, not dropped</text>
  <rect x="400" y="318" width="310" height="94" rx="10" fill="#e8f0fe" stroke="#2b6cb0" stroke-width="1.6" />
  <text x="555.0" y="345.2" font-size="14" font-weight="700" fill="#1f2933" text-anchor="middle">Retrieval</text>
  <text x="555.0" y="367.14" font-size="12" font-weight="400" fill="#52606d" text-anchor="middle">retrieval, retrieval-pg, datastore</text>
  <text x="555.0" y="383.7" font-size="12" font-weight="400" fill="#52606d" text-anchor="middle">hybrid search; provenance</text>
  <text x="555.0" y="400.26" font-size="12" font-weight="400" fill="#52606d" text-anchor="middle">envelope on every answer</text>
  <rect x="70" y="422" width="310" height="76" rx="10" fill="#e8f0fe" stroke="#2b6cb0" stroke-width="1.6" />
  <text x="225.0" y="448.47999999999996" font-size="14" font-weight="700" fill="#1f2933" text-anchor="middle">Authoring &amp; ingest</text>
  <text x="225.0" y="470.41999999999996" font-size="12" font-weight="400" fill="#52606d" text-anchor="middle">shapes, runbooks, authoring,</text>
  <text x="225.0" y="486.97999999999996" font-size="12" font-weight="400" fill="#52606d" text-anchor="middle">extract, docintel-az</text>
  <rect x="400" y="422" width="310" height="76" rx="10" fill="#e8f0fe" stroke="#2b6cb0" stroke-width="1.6" />
  <text x="555.0" y="448.47999999999996" font-size="14" font-weight="700" fill="#1f2933" text-anchor="middle">Providers</text>
  <text x="555.0" y="470.41999999999996" font-size="12" font-weight="400" fill="#52606d" text-anchor="middle">munarium-providers</text>
  <text x="555.0" y="486.97999999999996" font-size="12" font-weight="400" fill="#52606d" text-anchor="middle">BYOK model adapters</text>
  <rect x="70" y="508" width="640" height="64" rx="10" fill="#e8f0fe" stroke="#2b6cb0" stroke-width="1.6" />
  <text x="390.0" y="536.76" font-size="14" font-weight="700" fill="#1f2933" text-anchor="middle">Contract</text>
  <text x="390.0" y="558.7" font-size="12" font-weight="400" fill="#52606d" text-anchor="middle">proto (MMP), api-types, api-conv; server/contract/matrix vendored with contract.lock</text>
  <text x="70" y="600.0" font-size="13" font-weight="400" fill="#52606d" text-anchor="start">Commitments: additive-only migrations · wire N/N−1 policy · MUNARIUM_* config contract</text>
  <text x="70" y="624.0" font-size="13" font-weight="400" fill="#52606d" text-anchor="start">Deploy assets: Dockerfile, Helm chart, Terraform samples, runbooks</text>
  <rect x="790" y="200" width="660" height="470" rx="14" fill="#f4faf6" stroke="#2f855a" stroke-width="1.6" />
  <text x="810" y="232" font-size="16" font-weight="700" fill="#1f2933" text-anchor="start">matrix/  —  structured-evidence plane (separate service)</text>
  <rect x="810" y="250" width="620" height="58" rx="10" fill="#e6f4ea" stroke="#2f855a" stroke-width="1.6" />
  <text x="1120.0" y="275.76" font-size="14" font-weight="700" fill="#1f2933" text-anchor="middle">munarium-matrix-server</text>
  <text x="1120.0" y="297.7" font-size="12" font-weight="400" fill="#52606d" text-anchor="middle">source registry, governed record collections, verified query contracts</text>
  <rect x="810" y="318" width="300" height="94" rx="10" fill="#e6f4ea" stroke="#2f855a" stroke-width="1.6" />
  <text x="960.0" y="345.2" font-size="14" font-weight="700" fill="#1f2933" text-anchor="middle">Core adapters</text>
  <text x="960.0" y="367.14" font-size="12" font-weight="400" fill="#52606d" text-anchor="middle">postgres, mysql, sqlserver,</text>
  <text x="960.0" y="383.7" font-size="12" font-weight="400" fill="#52606d" text-anchor="middle">landing; unsupported combination</text>
  <text x="960.0" y="400.26" font-size="12" font-weight="400" fill="#52606d" text-anchor="middle">→ typed refusal</text>
  <rect x="1130" y="318" width="300" height="94" rx="10" fill="#e6f4ea" stroke="#2f855a" stroke-width="1.6" />
  <text x="1280.0" y="345.2" font-size="14" font-weight="700" fill="#1f2933" text-anchor="middle">Runtime</text>
  <text x="1280.0" y="367.14" font-size="12" font-weight="400" fill="#52606d" text-anchor="middle">workers, store, core, types</text>
  <text x="1280.0" y="383.7" font-size="12" font-weight="400" fill="#52606d" text-anchor="middle">materialization and</text>
  <text x="1280.0" y="400.26" font-size="12" font-weight="400" fill="#52606d" text-anchor="middle">typed observations</text>
  <rect x="810" y="422" width="620" height="76" rx="10" fill="#e6f4ea" stroke="#2f855a" stroke-width="1.6" />
  <text x="1120.0" y="456.76" font-size="14" font-weight="700" fill="#1f2933" text-anchor="middle">munarium-matrix-server-client</text>
  <text x="1120.0" y="478.7" font-size="12" font-weight="400" fill="#52606d" text-anchor="middle">seals the exact typed evidence an answer used into the Server</text>
  <rect x="810" y="508" width="620" height="64" rx="10" fill="#e6f4ea" stroke="#2f855a" stroke-width="1.6" />
  <text x="1120.0" y="536.76" font-size="14" font-weight="700" fill="#1f2933" text-anchor="middle">Contract publisher</text>
  <text x="1120.0" y="558.7" font-size="12" font-weight="400" fill="#52606d" text-anchor="middle">matrix/contract/publish.py cuts the contract the Server vendors</text>
  <text x="810" y="600.0" font-size="13" font-weight="400" fill="#52606d" text-anchor="start">Never calls a model provider · never writes a Server table ·</text>
  <text x="810" y="618.85" font-size="13" font-weight="400" fill="#52606d" text-anchor="start">never issues DDL/DML against a customer source. Analytics adapters = Enterprise.</text>
