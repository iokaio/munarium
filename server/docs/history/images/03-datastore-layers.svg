<svg xmlns='http://www.w3.org/2000/svg' width='1500' height='700' viewBox='0 0 1500 700' font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"><defs><marker id='a2f855a' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='8' markerHeight='8' orient='auto-start-reverse'><path d='M0 0 L10 5 L0 10 z' fill='#2f855a'/></marker><marker id='s2f855a' viewBox='0 0 10 10' refX='1' refY='5' markerWidth='8' markerHeight='8' orient='auto-start-reverse'><path d='M0 0 L10 5 L0 10 z' fill='#2f855a'/></marker><marker id='a52606d' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='8' markerHeight='8' orient='auto-start-reverse'><path d='M0 0 L10 5 L0 10 z' fill='#52606d'/></marker><marker id='s52606d' viewBox='0 0 10 10' refX='1' refY='5' markerWidth='8' markerHeight='8' orient='auto-start-reverse'><path d='M0 0 L10 5 L0 10 z' fill='#52606d'/></marker><marker id='ac05621' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='8' markerHeight='8' orient='auto-start-reverse'><path d='M0 0 L10 5 L0 10 z' fill='#c05621'/></marker><marker id='sc05621' viewBox='0 0 10 10' refX='1' refY='5' markerWidth='8' markerHeight='8' orient='auto-start-reverse'><path d='M0 0 L10 5 L0 10 z' fill='#c05621'/></marker></defs><rect width='100%' height='100%' fill='#ffffff'/><text x='32' y='44' font-size='24' font-weight='700' fill='#1f2933' text-anchor='start'>Datastore storage layers and serving lifecycle (PR #17)</text><text x='32' y='72' font-size='14' font-weight='400' fill='#52606d' text-anchor='start'>The Datastore is an optional serving engine for indexes whose authority stays in PostgreSQL.</text><text x='40' y='118' font-size='16' font-weight='700' fill='#1f2933' text-anchor='start'>Layers</text><rect x='40' y='134' width='600' height='64' rx='10' fill='#e8f0fe' stroke='#2b6cb0' stroke-width='1.6'/><text x='340.0' y='162.76' font-size='14' font-weight='700' fill='#1f2933' text-anchor='middle'>PostgreSQL</text><text x='340.0' y='184.7' font-size='12' font-weight='400' fill='#52606d' text-anchor='middle'>ledger, index catalog, bindings, rollout state — required, back up</text><rect x='40' y='210' width='600' height='64' rx='10' fill='#e8f0fe' stroke='#2b6cb0' stroke-width='1.6'/><text x='340.0' y='238.76' font-size='14' font-weight='700' fill='#1f2933' text-anchor='middle'>Source store</text><text x='340.0' y='260.7' font-size='12' font-weight='400' fill='#52606d' text-anchor='middle'>original document bytes (MUNARIUM_SOURCE_STORE)</text><rect x='40' y='286' width='600' height='64' rx='10' fill='#e6f4ea' stroke='#2f855a' stroke-width='1.6'/><text x='340.0' y='314.76' font-size='14' font-weight='700' fill='#1f2933' text-anchor='middle'>L2 artifact store</text><text x='340.0' y='336.7' font-size='12' font-weight='400' fill='#52606d' text-anchor='middle'>sealed manifests + engine files; local, S3, Azure Blob, GCS</text><rect x='40' y='362' width='600' height='64' rx='10' fill='#f4f5f7' stroke='#7b8794' stroke-width='1.6'/><text x='340.0' y='390.76' font-size='14' font-weight='700' fill='#1f2933' text-anchor='middle'>L1 local cache</text><text x='340.0' y='412.7' font-size='12' font-weight='400' fill='#52606d' text-anchor='middle'>hydrated, verified copies per replica; rebuildable from L2</text><rect x='40' y='438' width='600' height='64' rx='10' fill='#f4f5f7' stroke='#7b8794' stroke-width='1.6'/><text x='340.0' y='466.76' font-size='14' font-weight='700' fill='#1f2933' text-anchor='middle'>L0 open-shard cache</text><text x='340.0' y='488.7' font-size='12' font-weight='400' fill='#52606d' text-anchor='middle'>open engine handles per process; refilled after restart</text><rect x='40' y='514' width='600' height='64' rx='10' fill='#f4f5f7' stroke='#7b8794' stroke-width='1.6'/><text x='340.0' y='542.76' font-size='14' font-weight='700' fill='#1f2933' text-anchor='middle'>Staging</text><text x='340.0' y='564.7' font-size='12' font-weight='400' fill='#52606d' text-anchor='middle'>builder scratch space before sealing</text><text x='720' y='118' font-size='16' font-weight='700' fill='#1f2933' text-anchor='start'>Lifecycle of one logical index version</text><rect x='720' y='134' width='300' height='64' rx='10' fill='#e8f0fe' stroke='#2b6cb0' stroke-width='1.6'/><text x='870.0' y='162.76' font-size='14' font-weight='700' fill='#1f2933' text-anchor='middle'>Logical index</text><text x='870.0' y='184.7' font-size='12' font-weight='400' fill='#52606d' text-anchor='middle'>index_version_id in PostgreSQL</text><path d='M 870 198 L 870 220' fill='none' stroke='#52606d' stroke-width='1.8' marker-end='url(#a52606d)'/><rect x='720' y='220' width='300' height='64' rx='10' fill='#e6f4ea' stroke='#2f855a' stroke-width='1.6'/><text x='870.0' y='248.76' font-size='14' font-weight='700' fill='#1f2933' text-anchor='middle'>Build in staging</text><text x='870.0' y='270.7' font-size='12' font-weight='400' fill='#52606d' text-anchor='middle'>direct build or backfill</text><path d='M 870 284 L 870 306' fill='none' stroke='#52606d' stroke-width='1.8' marker-end='url(#a52606d)'/><rect x='720' y='306' width='300' height='64' rx='10' fill='#e6f4ea' stroke='#2f855a' stroke-width='1.6'/><text x='870.0' y='334.76' font-size='14' font-weight='700' fill='#1f2933' text-anchor='middle'>Seal to L2</text><text x='870.0' y='356.7' font-size='12' font-weight='400' fill='#52606d' text-anchor='middle'>artifact_id = physical content</text><path d='M 870 370 L 870 392' fill='none' stroke='#52606d' stroke-width='1.8' marker-end='url(#a52606d)'/><rect x='720' y='392' width='300' height='64' rx='10' fill='#e6f4ea' stroke='#2f855a' stroke-width='1.6'/><text x='870.0' y='420.76' font-size='14' font-weight='700' fill='#1f2933' text-anchor='middle'>Verify</text><text x='870.0' y='442.7' font-size='12' font-weight='400' fill='#52606d' text-anchor='middle'>hashes and generation checks</text><text x='1090' y='118' font-size='16' font-weight='700' fill='#1f2933' text-anchor='start'>Binding slots</text><rect x='1090' y='190' width='170' height='80' rx='10' fill='#f4f5f7' stroke='#7b8794' stroke-width='1.6'/><text x='1175.0' y='218.48' font-size='14' font-weight='700' fill='#1f2933' text-anchor='middle'>staged</text><text x='1175.0' y='240.42' font-size='12' font-weight='400' fill='#52606d' text-anchor='middle'>held, not</text><text x='1175.0' y='256.97999999999996' font-size='12' font-weight='400' fill='#52606d' text-anchor='middle'>serving</text><rect x='1280' y='190' width='170' height='80' rx='10' fill='#f4f5f7' stroke='#7b8794' stroke-width='1.6'/><text x='1365.0' y='218.48' font-size='14' font-weight='700' fill='#1f2933' text-anchor='middle'>shadow</text><text x='1365.0' y='240.42' font-size='12' font-weight='400' fill='#52606d' text-anchor='middle'>compared with</text><text x='1365.0' y='256.97999999999996' font-size='12' font-weight='400' fill='#52606d' text-anchor='middle'>serving</text><rect x='1090' y='336' width='360' height='76' rx='10' fill='#e6f4ea' stroke='#2f855a' stroke-width='1.6'/><text x='1270.0' y='362.47999999999996' font-size='14' font-weight='700' fill='#1f2933' text-anchor='middle'>serving</text><text x='1270.0' y='384.41999999999996' font-size='12' font-weight='400' fill='#52606d' text-anchor='middle'>changed only by promotion,</text><text x='1270.0' y='400.97999999999996' font-size='12' font-weight='400' fill='#52606d' text-anchor='middle'>after prewarm and readiness</text><path d='M 1020 392 L 1060 392 L 1060 150 L 1175 150 L 1175 190' fill='none' stroke='#52606d' stroke-width='1.8' marker-end='url(#a52606d)'/><path d='M 1060 150 L 1365 150 L 1365 190' fill='none' stroke='#52606d' stroke-width='1.8' marker-end='url(#a52606d)'/><rect x='1027.12' y='278' width='65.76' height='20' rx='4' fill='#ffffff' opacity='0.92'/><text x='1060' y='291' font-size='12' font-weight='600' fill='#52606d' text-anchor='middle'>bind one</text><path d='M 1175 270 L 1175 336' fill='none' stroke='#2f855a' stroke-width='1.8' marker-end='url(#a2f855a)'/><path d='M 1365 270 L 1365 336' fill='none' stroke='#2f855a' stroke-width='1.8' marker-end='url(#a2f855a)'/><rect x='1240.48' y='296' width='59.040000000000006' height='20' rx='4' fill='#ffffff' opacity='0.92'/><text x='1270' y='309' font-size='12' font-weight='600' fill='#2f855a' text-anchor='middle'>promote</text><rect x='1090' y='450' width='360' height='64' rx='10' fill='#fff4e0' stroke='#c05621' stroke-width='1.6'/><text x='1270.0' y='478.76' font-size='14' font-weight='700' fill='#1f2933' text-anchor='middle'>Rollback</text><text x='1270.0' y='500.7' font-size='12' font-weight='400' fill='#52606d' text-anchor='middle'>select PostgreSQL retrieval again</text><path d='M 1270 412 L 1270 450' fill='none' stroke='#c05621' stroke-width='1.8' marker-end='url(#ac05621)'/><text x='720' y='560.0' font-size='14' font-weight='400' fill='#52606d' text-anchor='start'>A collection&#x27;s active logical version and its retrieval-engine selector are separate decisions.</text><text x='720' y='580.3' font-size='14' font-weight='400' fill='#52606d' text-anchor='start'>An engine upgrade yields a new artifact_id under the same index_version_id, so session pins do not move.</text><text x='720' y='600.6' font-size='14' font-weight='400' fill='#52606d' text-anchor='start'>An artifact hash grants no access: every operation still authenticates a tenant and names a logical version.</text></svg>