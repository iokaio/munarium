<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" role="img" aria-label="The platform ring">
<title>The platform ring</title>
<defs><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1b2733"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5a6b7d"/></marker><marker id="a-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#93a3b4"/></marker><marker id="a-paper" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#fbfcfd"/></marker><marker id="a-band" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#eef2f6"/></marker><marker id="a-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1f5c8b"/></marker><marker id="a-accentfill" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#e3edf5"/></marker><marker id="a-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a8442a"/></marker><marker id="a-warnfill" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f6e5e0"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2c6e54"/></marker><marker id="a-okfill" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#e2efe9"/></marker></defs>
<rect width="900" height="400" fill="#fbfcfd"/>
<text x="450.0" y="26" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#1b2733" text-anchor="middle" font-weight="700">What your integration owns</text>
<rect x="300" y="120" width="300" height="160" rx="6" fill="#e2efe9" stroke="#2c6e54" stroke-width="1.4" stroke-dasharray="7 5"/>
<text x="450" y="180" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#1b2733" text-anchor="middle" font-weight="700">Munarium</text>
<text x="450" y="204" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#5a6b7d" text-anchor="middle" font-weight="normal">every table keyed by tenant_id;</text>
<text x="450" y="219" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#5a6b7d" text-anchor="middle" font-weight="normal">no cross-tenant read path</text>
<rect x="30" y="60" width="240" height="76" rx="6" fill="#fbfcfd" stroke="#93a3b4" stroke-width="1.4"/>
<text x="150.0" y="82" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#1b2733" text-anchor="middle" font-weight="600">Identity</text>
<text x="150.0" y="104" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#5a6b7d" text-anchor="middle" font-weight="normal">your IdP mints capability JWTs;</text>
<text x="150.0" y="118" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#5a6b7d" text-anchor="middle" font-weight="normal">TTL ≤ 24 h, revocable</text>
<rect x="630" y="60" width="240" height="76" rx="6" fill="#fbfcfd" stroke="#93a3b4" stroke-width="1.4"/>
<text x="750.0" y="82" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#1b2733" text-anchor="middle" font-weight="600">Observability</text>
<text x="750.0" y="104" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#5a6b7d" text-anchor="middle" font-weight="normal">x-munarium-request-id;</text>
<text x="750.0" y="118" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#5a6b7d" text-anchor="middle" font-weight="normal">/v1/reports/usage|audit|cost</text>
<rect x="30" y="300" width="240" height="76" rx="6" fill="#fbfcfd" stroke="#93a3b4" stroke-width="1.4"/>
<text x="150.0" y="322" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#1b2733" text-anchor="middle" font-weight="600">Cost governance</text>
<text x="150.0" y="344" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#5a6b7d" text-anchor="middle" font-weight="normal">BYOK keys, rpm/tpm budgets,</text>
<text x="150.0" y="358" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#5a6b7d" text-anchor="middle" font-weight="normal">tier routing, overrides closed</text>
<rect x="630" y="300" width="240" height="76" rx="6" fill="#fbfcfd" stroke="#93a3b4" stroke-width="1.4"/>
<text x="750.0" y="322" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#1b2733" text-anchor="middle" font-weight="600">Data lifecycle</text>
<text x="750.0" y="344" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#5a6b7d" text-anchor="middle" font-weight="normal">double-pass soft removal;</text>
<text x="750.0" y="358" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#5a6b7d" text-anchor="middle" font-weight="normal">physical deletion is a runbook</text>
<rect x="330" y="330" width="240" height="76" rx="6" fill="#fbfcfd" stroke="#93a3b4" stroke-width="1.4"/>
<text x="450.0" y="352" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#1b2733" text-anchor="middle" font-weight="600">Tenancy</text>
<text x="450.0" y="374" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#5a6b7d" text-anchor="middle" font-weight="normal">one tenant per key, enforced in every</text>
<text x="450.0" y="388" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#5a6b7d" text-anchor="middle" font-weight="normal">query</text>
<text x="450.0" y="388" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#5a6b7d" text-anchor="middle" font-weight="normal" font-style="italic">Five touchpoints. Munarium implements none of them, and says so.</text>
</svg>
