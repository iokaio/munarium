<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" role="img" aria-label="Triage">
<title>Triage</title>
<defs><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1b2733"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5a6b7d"/></marker><marker id="a-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#93a3b4"/></marker><marker id="a-paper" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#fbfcfd"/></marker><marker id="a-band" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#eef2f6"/></marker><marker id="a-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1f5c8b"/></marker><marker id="a-accentfill" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#e3edf5"/></marker><marker id="a-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a8442a"/></marker><marker id="a-warnfill" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f6e5e0"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2c6e54"/></marker><marker id="a-okfill" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#e2efe9"/></marker></defs>
<rect width="900" height="400" fill="#fbfcfd"/>
<text x="450.0" y="26" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#1b2733" text-anchor="middle" font-weight="700">Triage: start with what the process did</text>
<rect x="40" y="62" width="380" height="30" rx="6" fill="#f6e5e0" stroke="#a8442a" stroke-width="1.4"/>
<text x="230.0" y="84" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#1b2733" text-anchor="middle" font-weight="600">the server will not start</text>
<rect x="40" y="108" width="380" height="56" rx="6" fill="#fbfcfd" stroke="#93a3b4" stroke-width="1.4"/>
<text x="230.0" y="130" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#1b2733" text-anchor="middle" font-weight="600">exit 2 — config error</text>
<text x="230.0" y="152" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#5a6b7d" text-anchor="middle" font-weight="normal">fix the variable the message names</text>
<rect x="40" y="176" width="380" height="56" rx="6" fill="#fbfcfd" stroke="#93a3b4" stroke-width="1.4"/>
<text x="230.0" y="198" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#1b2733" text-anchor="middle" font-weight="600">exit 1 — startup error</text>
<text x="230.0" y="220" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#5a6b7d" text-anchor="middle" font-weight="normal">the world refused: connectivity, credentials</text>
<rect x="40" y="244" width="380" height="70" rx="6" fill="#fbfcfd" stroke="#93a3b4" stroke-width="1.4"/>
<text x="230.0" y="266" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#1b2733" text-anchor="middle" font-weight="600">migration checksum mismatch</text>
<text x="230.0" y="288" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#5a6b7d" text-anchor="middle" font-weight="normal">an applied migration&#x27;s bytes changed;</text>
<text x="230.0" y="302" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#5a6b7d" text-anchor="middle" font-weight="normal">recreate the database (compose down -v locally)</text>
<rect x="480" y="62" width="380" height="30" rx="6" fill="#f6e5e0" stroke="#a8442a" stroke-width="1.4"/>
<text x="670.0" y="84" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#1b2733" text-anchor="middle" font-weight="600">a request failed</text>
<rect x="480" y="108" width="380" height="34" rx="6" fill="#fbfcfd" stroke="#93a3b4" stroke-width="1.4"/>
<text x="510" y="130" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#1b2733" text-anchor="middle" font-weight="600">400</text>
<text x="552" y="130" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#5a6b7d" text-anchor="start" font-weight="normal">uid-required / invalid-input</text>
<rect x="480" y="148" width="380" height="34" rx="6" fill="#fbfcfd" stroke="#93a3b4" stroke-width="1.4"/>
<text x="510" y="170" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#1b2733" text-anchor="middle" font-weight="600">401</text>
<text x="552" y="170" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#5a6b7d" text-anchor="start" font-weight="normal">unauthenticated</text>
<rect x="480" y="188" width="380" height="34" rx="6" fill="#fbfcfd" stroke="#93a3b4" stroke-width="1.4"/>
<text x="510" y="210" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#1b2733" text-anchor="middle" font-weight="600">403</text>
<text x="552" y="210" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#5a6b7d" text-anchor="start" font-weight="normal">forbidden — level or compartment</text>
<rect x="480" y="228" width="380" height="34" rx="6" fill="#fbfcfd" stroke="#93a3b4" stroke-width="1.4"/>
<text x="510" y="250" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#1b2733" text-anchor="middle" font-weight="600">404</text>
<text x="552" y="250" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#5a6b7d" text-anchor="start" font-weight="normal">unknown asset or version</text>
<rect x="480" y="268" width="380" height="34" rx="6" fill="#fbfcfd" stroke="#93a3b4" stroke-width="1.4"/>
<text x="510" y="290" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#1b2733" text-anchor="middle" font-weight="600">409</text>
<text x="552" y="290" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#5a6b7d" text-anchor="start" font-weight="normal">head conflict — retry at the observed head</text>
<rect x="480" y="308" width="380" height="34" rx="6" fill="#fbfcfd" stroke="#93a3b4" stroke-width="1.4"/>
<text x="510" y="330" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#1b2733" text-anchor="middle" font-weight="600">422</text>
<text x="552" y="330" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#5a6b7d" text-anchor="start" font-weight="normal">gate refusal — read the finding</text>
<text x="450.0" y="388" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#5a6b7d" text-anchor="middle" font-weight="normal" font-style="italic">A status code narrows it to one page of the error registry.</text>
</svg>
