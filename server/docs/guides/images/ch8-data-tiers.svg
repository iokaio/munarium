<text x="440" y="278" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#1b2733" text-anchor="middle" font-weight="normal">sources.blob_uri</text>
