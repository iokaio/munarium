<rect width="880" height="350" fill="#fbfcfd"/>
<text x="440.0" y="26" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#1b2733" text-anchor="middle" font-weight="700">Two data tiers, one bridge</text>
<rect x="40" y="60" width="340" height="150" rx="6" fill="#e3edf5" stroke="#1f5c8b" stroke-width="1.4"/>
