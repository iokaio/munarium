<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380" role="img" aria-label="Two memory surfaces">
<title>Two memory surfaces</title>
<defs><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1b2733"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5a6b7d"/></marker><marker id="a-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#93a3b4"/></marker><marker id="a-paper" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#fbfcfd"/></marker><marker id="a-band" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#eef2f6"/></marker><marker id="a-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1f5c8b"/></marker><marker id="a-accentfill" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#e3edf5"/></marker><marker id="a-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a8442a"/></marker><marker id="a-warnfill" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f6e5e0"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2c6e54"/></marker><marker id="a-okfill" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#e2efe9"/></marker></defs>
<rect width="900" height="380" fill="#fbfcfd"/>
<text x="450.0" y="26" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#1b2733" text-anchor="middle" font-weight="700">Two surfaces, one prompt</text>
<rect x="40" y="62" width="360" height="130" rx="6" fill="#e3edf5" stroke="#1f5c8b" stroke-width="1.4"/>
<text x="220.0" y="84" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#1b2733" text-anchor="middle" font-weight="600">Document index</text>
<text x="220.0" y="106" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#5a6b7d" text-anchor="middle" font-weight="normal">content-addressed sources</text>
<text x="220.0" y="120" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#5a6b7d" text-anchor="middle" font-weight="normal">immutable, clearance-filtered</text>
<text x="220.0" y="134" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#5a6b7d" text-anchor="middle" font-weight="normal">search → hits + provenance</text>
<text x="220.0" y="148" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#5a6b7d" text-anchor="middle" font-weight="normal">says what documents SAY</text>
<rect x="500" y="62" width="360" height="130" rx="6" fill="#e2efe9" stroke="#2c6e54" stroke-width="1.4"/>
<text x="680.0" y="84" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#1b2733" text-anchor="middle" font-weight="600">Canonical memory</text>
<text x="680.0" y="106" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#5a6b7d" text-anchor="middle" font-weight="normal">extracted claims meet the gates</text>
<text x="680.0" y="120" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#5a6b7d" text-anchor="middle" font-weight="normal">accepted → canon + budgeted brief</text>
<text x="680.0" y="134" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#5a6b7d" text-anchor="middle" font-weight="normal">disputed → human review queue</text>
<text x="680.0" y="148" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#5a6b7d" text-anchor="middle" font-weight="normal">says what is TRUE NOW</text>
<rect x="620" y="208" width="240" height="54" rx="6" fill="#f6e5e0" stroke="#a8442a" stroke-width="1.4"/>
<text x="740.0" y="230" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#1b2733" text-anchor="middle" font-weight="600">review queue</text>
<text x="740.0" y="252" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#5a6b7d" text-anchor="middle" font-weight="normal">never enters the brief</text>
<line x1="680" y1="194" x2="700" y2="206" stroke="#93a3b4" stroke-width="1.6" marker-end="url(#a-line)"/>
<rect x="250" y="286" width="400" height="68" rx="6" fill="#eef2f6" stroke="#93a3b4" stroke-width="1.4"/>
<text x="450.0" y="308" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#1b2733" text-anchor="middle" font-weight="600">your prompt</text>
<text x="450.0" y="330" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#5a6b7d" text-anchor="middle" font-weight="normal">known facts + document hits + provenance + the question</text>
<line x1="220" y1="194" x2="380" y2="284" stroke="#93a3b4" stroke-width="1.6" marker-end="url(#a-line)"/>
<line x1="680" y1="194" x2="520" y2="284" stroke="#93a3b4" stroke-width="1.6" marker-end="url(#a-line)"/>
<text x="450.0" y="368" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#5a6b7d" text-anchor="middle" font-weight="normal" font-style="italic">Retrieval never decides truth; the ledger never guesses at wording.</text>
</svg>
