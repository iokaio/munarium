<text x="165.0" y="118" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#5a6b7d" text-anchor="middle" font-weight="normal">8080 REST</text>
<text x="165.0" y="132" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#5a6b7d" text-anchor="middle" font-weight="normal">50051 direct gRPC</text>
<text x="165.0" y="146" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#5a6b7d" text-anchor="middle" font-weight="normal">9090 ops / metrics</text>
<rect x="315" y="60" width="250" height="118" rx="6" fill="#fbfcfd" stroke="#93a3b4" stroke-width="1.4"/>
<text x="440.0" y="82" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#1b2733" text-anchor="middle" font-weight="600">From source</text>
<text x="440.0" y="104" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#5a6b7d" text-anchor="middle" font-weight="normal">18080 REST</text>
<text x="440.0" y="118" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#5a6b7d" text-anchor="middle" font-weight="normal">15051 gRPC</text>
<text x="440.0" y="132" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#5a6b7d" text-anchor="middle" font-weight="normal">19090 ops</text>
<text x="440.0" y="146" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#5a6b7d" text-anchor="middle" font-weight="normal">18443 gateway</text>
<rect x="590" y="60" width="250" height="118" rx="6" fill="#fbfcfd" stroke="#93a3b4" stroke-width="1.4"/>
<text x="715.0" y="82" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#1b2733" text-anchor="middle" font-weight="600">Test tiers</text>
<text x="715.0" y="104" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#5a6b7d" text-anchor="middle" font-weight="normal">18080/15051/19090 black-box</text>
<text x="715.0" y="118" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#5a6b7d" text-anchor="middle" font-weight="normal">18081/19091 platform</text>
<text x="715.0" y="132" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#5a6b7d" text-anchor="middle" font-weight="normal">5433 Postgres (host)</text>
<text x="715.0" y="146" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#5a6b7d" text-anchor="middle" font-weight="normal">9000/9001 MinIO</text>
<rect x="40" y="205" width="800" height="62" rx="6" fill="#f6e5e0" stroke="#a8442a" stroke-width="1.4"/>
<text x="440.0" y="227" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#1b2733" text-anchor="middle" font-weight="600">The reaping rule</text>
<text x="440.0" y="249" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#5a6b7d" text-anchor="middle" font-weight="normal">A script reaps only a stale munarium-server on the ALTERNATE ports,</text>
<text x="440.0" y="263" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#5a6b7d" text-anchor="middle" font-weight="normal">and refuses to touch anything else on the machine.</text>
<text x="440.0" y="318" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#5a6b7d" text-anchor="middle" font-weight="normal" font-style="italic">Alternate ports exist so a from-source run never fights a compose stack.</text>
