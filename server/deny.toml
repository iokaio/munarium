# SPDX-License-Identifier: Apache-2.0
# cargo-deny gate — the standing defense against the relicensing wave (architecture.md §11).
# Any dependency that turns is replaced behind its seam.

[licenses]
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    "OpenSSL",  # ring's bundled license text; no openssl linkage exists in this workspace
]

# Workspace crates are listed as exceptions: the gate exists for THIRD-party
# license drift, and first-party crates are checked by check_license.py.
[[licenses.exceptions]]
name = "munarium-core"
allow = ["Apache-2.0"]
[[licenses.exceptions]]
name = "munarium-proto"
allow = ["Apache-2.0"]
[[licenses.exceptions]]
name = "munarium-api-types"
