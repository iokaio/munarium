# SPDX-License-Identifier: Apache-2.0
# The shape every collection in the worked example is governed by. The
# chunk size is a teaching value for short documents, not a sizing
# recommendation: see server/docs/guides/retrieval-sizing.md.
apiVersion: munarium.ioka.io/v1
kind: Shape
metadata: { name: halvard-support-documents, version: 1 }
spec:
  fact:
    schema:
      type: object
      properties:
        subject: { type: string, pattern: "^[a-z0-9][a-z0-9_-]{0,63}$" }
        key: { type: string, pattern: "^[a-z][a-z0-9_:-]{0,63}$" }
        value: { type: string, minLength: 1, maxLength: 512 }
      required: [subject, key, value]
    supersession:
      identity: [subject, key]
  chunking: { strategy: para@1, max_chars: 900 }
  indexing: { rrf_k: 60, candidate_n: 50 }
