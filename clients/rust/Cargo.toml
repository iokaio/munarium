# SPDX-License-Identifier: Apache-2.0
[workspace]
resolver = "2"
members = ["munarium-client", "munarium-client-conformance"]

[workspace.package]
version = "1.0.0"
edition = "2021"
# Both member crates inherit the license; check_license.py fails CI if any
# manifest under clients/ says otherwise.
license = "Apache-2.0"
repository = "https://github.com/iokaio/munarium"

[workspace.dependencies]
# The wire crates, straight from the tree that owns them.
#
# `version` beside `path` is what lets these publish: cargo strips `path` when
# packaging and needs a registry version to put in its place. Locally the path
# wins, so a change to the server's wire types is felt here immediately.
#
# Deliberately absent: the server's core, conformance and conversion crates.
# The conformance suite is client-native, so this graph contains exactly the
# two crates that define the wire and nothing else.
munarium-api-types = { path = "../../server/src/munarium-api-types", version = "1.0.0", features = ["proto"] }
munarium-proto = { path = "../../server/src/munarium-proto", version = "1.0.0" }
# async + transports (rustls everywhere — no openssl, matching the server workspace)
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
tokio-stream = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
httpdate = "1.0"
tonic = { version = "0.12", features = ["tls", "tls-roots"] }
tonic-types = "0.12"
prost = "0.13"
# serialization + ids
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
# glue
async-trait = "0.1"
thiserror = "2"
futures-core = "0.3"
futures-util = "0.3"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
bytes = "1"
