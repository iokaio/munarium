# SPDX-License-Identifier: Apache-2.0
[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "munarium-matrix"
version = "1.0.0"
description = "Python client for Munarium Matrix, the structured-evidence plane"
readme = "README.md"
requires-python = ">=3.10"
# PEP 639: the SPDX expression lands in the wheel as `License-Expression`, and the
# two files ship under `.dist-info/licenses/`. They are copies of ../LICENSE and
# ../NOTICE (hatchling cannot reach outside the project root); check_license.py
# fails CI if a copy ever differs from the original.
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Ioka" }]
# One runtime dependency. The server clients settled on httpx for the same
# reasons — one library for sync and async, a timeout that is not optional,
# and no transitive surprise — and a second HTTP stack in one repository is a
# second set of TLS and proxy behaviours to explain.
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.hatch.build.targets.wheel]
packages = ["src/munarium_matrix"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[project.urls]
Homepage = "https://github.com/iokaio/munarium"
Repository = "https://github.com/iokaio/munarium"
Changelog = "https://github.com/iokaio/munarium/blob/main/clients/CHANGELOG.md"
