# Automatic repository gates for every PR and main push. Full component
# builds run locally first and are available as manual workflows.
name: repo hygiene

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: repo-hygiene-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    name: private material, licences and notices
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: client compatibility
        run: python3 clients/check_compatibility.py

      # README.md says the private research behind Munarium is deliberately not
      # carried here. This is what holds that sentence true.
      - name: private material scan
        run: python3 scripts/private_material_scan.py

      # The component link checkers stop at server/docs and matrix/. The root
      # docs/ tree and the root markdown files are gated here instead: every
      # relative link resolves, every page is listed from its directory index.
      - name: root docs links and indexes
        run: python3 scripts/docs_linkcheck.py

      - name: lab grader and docs gate regression tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

      # Apache-2.0 headers, licence texts and notice files, across the whole
      # tree rather than one component of it.
      - name: licence and notice check
        run: python3 check_license.py

      # Secret scan, over the whole tree. The binary rather than the action: the
      # action needs a licence key for organisation repositories, and a scanner
      # that silently skips is the failure this workflow exists to prevent. The
      # release is pinned by version AND by the checksum gitleaks publishes.
      - name: gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          curl -sSL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          # The working tree on every push; the history too once one exists.
          ./gitleaks dir . --config .gitleaks.toml --no-banner --redact --exit-code 1
          if [ "$(git rev-list --count HEAD 2>/dev/null || echo 0)" -gt 0 ]; then
            ./gitleaks git . --config .gitleaks.toml --no-banner --redact --exit-code 1
          fi

      - name: install and run actionlint
        run: |
          version=1.7.12
          archive="actionlint_${version}_linux_amd64.tar.gz"
          curl -sSfL "https://github.com/rhysd/actionlint/releases/download/v${version}/${archive}" -o "/tmp/${archive}"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  /tmp/${archive}" | sha256sum -c -
          tar -xzf "/tmp/${archive}" -C /tmp actionlint
          # Validate workflow syntax; shell scripts keep their component gates.
          /tmp/actionlint -shellcheck=
