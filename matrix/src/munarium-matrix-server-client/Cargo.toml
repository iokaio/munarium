[package]
name = "munarium-matrix-server-client"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Thin client for munarium-server: evidence sealing, bulk upload, ledger reads, findings. Written against the vendored contract — never against a server crate (ground rule 1)."

[dependencies]
munarium-matrix-core = { workspace = true }
munarium-matrix-types = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
async-trait = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
base64 = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
