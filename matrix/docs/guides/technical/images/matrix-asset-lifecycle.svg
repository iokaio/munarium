<rect x="202" y="218" width="160" height="40" rx="6" fill="#eef2f6" stroke="#93a3b4" stroke-width="1.4"/>
<text x="282.0" y="240" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#1b2733" text-anchor="middle" font-weight="600">apply</text>
