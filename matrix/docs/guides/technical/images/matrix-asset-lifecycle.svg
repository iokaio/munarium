<text x="454.0" y="240" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#1b2733" text-anchor="middle" font-weight="600">probe</text>
<line x1="362" y1="238" x2="371" y2="238" stroke="#93a3b4" stroke-width="1.6" marker-end="url(#a-line)"/>
<rect x="546" y="218" width="160" height="40" rx="6" fill="#eef2f6" stroke="#93a3b4" stroke-width="1.4"/>
<text x="626.0" y="240" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#1b2733" text-anchor="middle" font-weight="600">introspect</text>
<line x1="534" y1="238" x2="543" y2="238" stroke="#93a3b4" stroke-width="1.6" marker-end="url(#a-line)"/>
<rect x="718" y="218" width="160" height="40" rx="6" fill="#eef2f6" stroke="#93a3b4" stroke-width="1.4"/>
<text x="798.0" y="240" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#1b2733" text-anchor="middle" font-weight="600">publish</text>
<line x1="706" y1="238" x2="715" y2="238" stroke="#93a3b4" stroke-width="1.6" marker-end="url(#a-line)"/>
<text x="460.0" y="328" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#5a6b7d" text-anchor="middle" font-weight="normal" font-style="italic">Resolve every posture or schema refusal before a contract is written.</text>
