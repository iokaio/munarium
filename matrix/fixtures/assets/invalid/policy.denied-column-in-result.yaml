apiVersion: munarium.ioka.io/v1
kind: QueryContract
metadata: { name: deniedinresult, version: 1 }
spec:
  source: crm
  statementByDialect:
    postgres: { inline: "SELECT region, owner_email FROM opportunities" }
  result:
    columns:
      region: { type: string, key: true }
      owner_email: { type: string }
    columnOrder: [region, owner_email]
  policy: { deniedColumns: [owner_email] }
