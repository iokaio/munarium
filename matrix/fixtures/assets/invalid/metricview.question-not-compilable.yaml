# a verified question asks for 'margin', which the view does not declare.
apiVersion: munarium.ioka.io/v1
kind: MetricView
metadata: { name: pipeline-metrics, version: 1 }
spec:
  source: dbx-crm
  view: mxtest.pipeline_metrics
  measures:
    open_pipeline: { type: decimal, scale: 2 }
  dimensions:
    region: { type: string }
  verifiedQuestions:
    - question: Margin by region
      intent: { measures: [margin], dimensions: [region] }
      expect: { rows: 2 }
