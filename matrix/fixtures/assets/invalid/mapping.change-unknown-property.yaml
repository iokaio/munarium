apiVersion: munarium.ioka.io/v1
kind: ClaimMapping
metadata: { name: unknownchange, version: 1 }
spec:
  source: crm
  entity:
    table: holdings
    key: [holder_id]
    subjectTemplate: "shareholder.{holder_id}"
  properties:
    shares: { column: shares, type: decimal, scale: 0 }
  temporal:
    validTime: { column: effective_date }
  changes:
    not_a_property: { onUpdate: update }
