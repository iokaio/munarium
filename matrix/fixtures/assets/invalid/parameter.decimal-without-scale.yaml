apiVersion: munarium.ioka.io/v1
kind: QueryContract
metadata: { name: unscaled, version: 1 }
spec:
  source: crm
  parameters:
    threshold: { type: decimal, required: true }
  statementByDialect: { postgres: { inline: "SELECT region FROM opportunities" } }
  result:
    columns:
      region: { type: string, key: true }
    columnOrder: [region]
