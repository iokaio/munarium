# filters.allowedDimensions names 'owner', which is not a declared dimension.
apiVersion: munarium.ioka.io/v1
kind: MetricView
metadata: { name: pipeline-metrics, version: 1 }
spec:
  source: dbx-crm
  view: mxtest.pipeline_metrics
  measures:
    open_pipeline: { type: decimal, scale: 2 }
  dimensions:
    region: { type: string }
  filters: { allowedDimensions: [owner] }
