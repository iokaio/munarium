# An alias table nothing reads. The key resolver never consults it, so every
# form in here is decoration that an operator will believe is armed.
apiVersion: munarium.ioka.io/v1
kind: ClaimMapping
metadata:
  name: captable-holdings
  version: 1
spec:
  source: crm
  mode: shadow
  entity:
    table: holdings
    key: [holder_id, company_id]
    subjectTemplate: "shareholder.{holder_id}"
    scopeTemplate: "company.{company_id}.captable"
    identity:
      resolver: entity_key
      aliases:
        column: holder_name
        entries:
          - subject: shareholder.jane-rowntree
            forms: ["Jane Rowntree"]
  properties:
    shares_outstanding: { column: shares, type: decimal, scale: 0 }
  temporal:
    validTime: { column: effective_date }
  changes:
    shares_outstanding: { onUpdate: update, onBackdated: requires_review }
