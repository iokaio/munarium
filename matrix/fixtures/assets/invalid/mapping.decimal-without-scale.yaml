apiVersion: munarium.ioka.io/v1
kind: ClaimMapping
metadata: { name: unscaledprop, version: 1 }
spec:
  source: crm
  entity:
    table: holdings
    key: [holder_id]
    subjectTemplate: "shareholder.{holder_id}"
  properties:
    shares: { column: shares, type: decimal }
  temporal:
    validTime: { column: effective_date }
