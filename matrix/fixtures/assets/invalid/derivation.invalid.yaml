apiVersion: munarium.ioka.io/v1
kind: QueryContract
metadata: { name: badderivation, version: 1 }
spec:
  source: crm
  statementByDialect: { postgres: { inline: "SELECT region FROM opportunities" } }
  result:
    columns:
      region: { type: string, key: true }
    columnOrder: [region]
    derivations:
      total: { op: sum, over: region }
