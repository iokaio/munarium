# 'region' is both a measure and a dimension: one result column, one meaning.
apiVersion: munarium.ioka.io/v1
kind: MetricView
metadata: { name: pipeline-metrics, version: 1 }
spec:
  source: dbx-crm
  view: mxtest.pipeline_metrics
  measures:
    open_pipeline: { type: decimal, scale: 2 }
    region: { type: int64 }
  dimensions:
    region: { type: string }
