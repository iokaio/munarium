# a verified question asks for 'margin', which the view does not declare.
apiVersion: munarium.ioka.io/v1
kind: DataView
metadata: { name: pipeline-by-region, version: 1 }
spec:
  source: crm
  table: opportunities
  measures:
    pipeline_amount: { op: sum, column: amount, type: decimal, scale: 2 }
  dimensions:
    region: { type: string }
  verifiedQuestions:
    - question: Margin by region
      intent: { measures: [margin], dimensions: [region] }
      expect: { rows: 1 }
