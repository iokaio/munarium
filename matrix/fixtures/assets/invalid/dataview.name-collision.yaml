# 'region' is both a measure and a dimension.
apiVersion: munarium.ioka.io/v1
kind: DataView
metadata: { name: pipeline-by-region, version: 1 }
spec:
  source: crm
  table: opportunities
  measures:
    pipeline_amount: { op: sum, column: amount, type: decimal, scale: 2 }
    region: { op: count, type: int64 }
  dimensions:
    region: { type: string }
